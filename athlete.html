<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLTimer">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
<title>SLTimer &#8212; Palista</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-back{background:none;border:none;cursor:pointer;font-size:20px;color:#666;padding:0 4px;line-height:1;display:flex;align-items:center}
.topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-brand img{width:28px;height:28px;border-radius:7px;display:block}
.topbar-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1B3A5C;letter-spacing:0.5px;line-height:1}
.topbar-divider{width:0.5px;height:18px;background:rgba(0,0,0,0.12);flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:#111;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-save{background:#185FA5;border:none;color:#fff;font-size:14px;font-weight:600;padding:8px 18px;border-radius:10px;cursor:pointer;font-family:inherit;transition:opacity .12s;flex-shrink:0}
.btn-save:active{opacity:.8}
.btn-save:disabled{opacity:.4;cursor:not-allowed}

/* Tabs */
.tabs-bar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.10);display:flex;padding:0 16px;gap:0;position:sticky;top:53px;z-index:9}
.tab-btn{flex:1;padding:12px 8px 10px;font-size:14px;font-weight:600;color:#aaa;background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;text-align:center}
.tab-btn.active{color:#185FA5;border-bottom-color:#185FA5}
.tab-btn:active{opacity:.7}
.tab-panel{display:none}
.tab-panel.active{display:block}

.content{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;padding-bottom:40px}
.avatar-wrap{display:flex;justify-content:center;padding:8px 0 4px}
.avatar{width:76px;height:76px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;border:0.5px solid #B5D4F4;letter-spacing:-1px;transition:background .2s}
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:0 2px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;overflow:hidden}
.field-row{padding:12px 16px;display:flex;flex-direction:column;gap:5px}
.field-row+.field-row{border-top:0.5px solid #f2f2f2}
.field-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.04em}
.field-label .opt{font-weight:400;color:#bbb;text-transform:none;letter-spacing:0;font-size:11px}
.field-input{border:none;outline:none;font-size:15px;color:#111;background:transparent;font-family:inherit;width:100%;padding:0;-webkit-appearance:none}
.field-input::placeholder{color:#ccc}
.sex-row{display:flex;gap:8px;margin-top:2px}
.sex-btn{flex:1;padding:9px 6px;border-radius:10px;border:0.5px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:#888;cursor:pointer;font-family:inherit;transition:all .12s}
.sex-btn.active{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.sex-btn:active{opacity:.75}
.cat-row{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.cat-btn{padding:9px 20px;border-radius:10px;border:0.5px solid #ddd;background:#fff;font-size:14px;font-weight:700;color:#aaa;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:0.03em}
.cat-btn:active{opacity:.75}
.cat-btn.k1.active{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.cat-btn.c1.active{background:#E1F5EE;border-color:#0F6E56;color:#085041}
.cat-btn.kxc.active{background:#FAEEDA;border-color:#854F0B;color:#633806}
.cat-desc{font-size:12px;color:#bbb;margin-top:6px}
.cat-desc span{font-weight:600}

/* Acceso */
.access-row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.access-row+.access-row,.share-input-area,.shared-item{border-top:0.5px solid #f2f2f2}
.mini-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.mini-avatar.owner{background:#E6F1FB;color:#0C447C}
.mini-avatar.shared{background:#f0f0f0;color:#666}
.access-info{flex:1;min-width:0}
.access-name{font-size:14px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.access-sub{font-size:12px;color:#aaa;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-owner{font-size:11px;font-weight:700;background:#E6F1FB;color:#0C447C;padding:3px 9px;border-radius:100px;white-space:nowrap}
.btn-add{background:none;border:0.5px solid #185FA5;color:#185FA5;font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-add:active{background:#E6F1FB}
.share-input-area{padding:12px 16px;display:none}
.share-input-inner{display:flex;gap:8px}
.share-text-input{flex:1;border:0.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:14px;color:#111;font-family:inherit;outline:none;background:#fff;-webkit-appearance:none}
.share-text-input:focus{border-color:#185FA5}
.share-text-input::placeholder{color:#ccc}
.share-hint{font-size:11px;color:#bbb;margin-top:6px;line-height:1.5}
.share-hint b{color:#888;font-weight:600}
.share-spinner{display:none;width:16px;height:16px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;align-self:center}
.share-spinner.show{display:block}
.btn-share-confirm{background:#185FA5;border:none;color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px}
.btn-share-confirm:active{opacity:.8}
.btn-share-confirm:disabled{opacity:.5;cursor:not-allowed}
.shared-item{display:flex;align-items:center;gap:12px;padding:11px 16px}
.btn-revoke{background:none;border:none;color:#A32D2D;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:5px 8px;border-radius:6px;white-space:nowrap}
.btn-revoke:active{background:#FCEBEB}

/* Historial */
.ses-card{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.ses-icon{width:40px;height:40px;border-radius:11px;background:#E1F5EE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ses-icon svg{width:20px;height:20px;fill:none;stroke:#085041;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ses-info{flex:1;min-width:0}
.ses-name{font-size:15px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-sub{font-size:12px;color:#aaa;margin-top:2px}
.ses-best{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#0F6E56;letter-spacing:0.5px;flex-shrink:0;text-align:right;line-height:1.1}
.ses-best-lbl{font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;text-align:right;font-family:inherit}
.empty-state{text-align:center;padding:48px 24px;color:#bbb}
.empty-state p{font-size:14px;font-weight:600;color:#bbb}
.hist-spinner{display:flex;justify-content:center;padding:40px 0}

/* ── ESTADÍSTICAS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:#1B3A5C;letter-spacing:0.5px;line-height:1}
.stat-val.green{color:#0F6E56}
.stat-val.red{color:#A32D2D}
.stat-val.small{font-size:22px}
.stat-sub{font-size:11px;color:#bbb;font-weight:500;margin-top:1px}
.tramo-table{width:100%;border-collapse:collapse}
.tramo-table th{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:10px 14px;border-bottom:0.5px solid #f0f0f0;text-align:left;background:#fafafa}
.tramo-table td{padding:10px 14px;font-size:14px;color:#111;border-bottom:0.5px solid #f5f5f5}
.tramo-table tr:last-child td{border-bottom:none}
.tramo-table td.time{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#1B3A5C;letter-spacing:0.5px}
.tramo-table td.best-time{color:#0F6E56}
.tramo-table td.dsq{color:#A32D2D;font-size:12px;font-weight:700}
.tramo-table td.avg{color:#185FA5;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.3px}
.prog-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:0.5px solid #f5f5f5}
.prog-row:last-child{border-bottom:none}
.prog-date{font-size:12px;color:#aaa;font-weight:500;flex-shrink:0;min-width:70px}
.prog-bar-wrap{flex:1;background:#f0f4f8;border-radius:100px;height:8px;overflow:hidden}
.prog-bar{height:100%;border-radius:100px;background:#185FA5;transition:width .4s}
.prog-bar.best{background:#0F6E56}
.prog-time{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#1B3A5C;letter-spacing:0.3px;flex-shrink:0;min-width:58px;text-align:right}
.stat-spinner{display:flex;justify-content:center;padding:40px 0}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:7px 14px;border-radius:100px;border:0.5px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:#888;cursor:pointer;font-family:inherit;transition:all .12s}
.filter-btn.active{background:#185FA5;border-color:#185FA5;color:#fff}
.filter-btn:active{opacity:.75}
.pen-dist-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:0.5px solid #f5f5f5}
.pen-dist-row:last-child{border-bottom:none}
.pen-dist-label{font-size:13px;color:#111;font-weight:600;flex-shrink:0;width:80px}
.pen-dist-bar-wrap{flex:1;background:#f0f4f8;border-radius:100px;height:7px;overflow:hidden}
.pen-dist-bar{height:100%;border-radius:100px;background:#F59E0B}
.pen-dist-bar.dsq-bar{background:#A32D2D}
.pen-dist-val{font-size:13px;font-weight:700;color:#111;flex-shrink:0;min-width:28px;text-align:right}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#A32D2D}
.toast.ok{background:#0F6E56}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}
.btn-delete{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:0.5px solid #F7C1C1;background:#FCEBEB;color:#A32D2D;font-family:inherit;transition:opacity .12s}
.btn-delete:active{opacity:.75}
</style>
</head>
<body>
<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Guardando...</p></div>

<div class="topbar">
  <button class="topbar-back" onclick="goBack()">&#8592;</button>
  <div class="topbar-brand">
    <img src="icons/icon-192x192.png" alt="SLTimer">
    <span class="topbar-brand-name">SLTimer</span>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-title" id="page-title">Nuevo palista</span>
  <div class="topbar-actions">
    <button class="btn-save" id="btn-save" onclick="savePalista()">Guardar</button>
  </div>
</div>

<!-- PESTAÑAS -->
<div class="tabs-bar" id="tabs-bar" style="display:none">
  <button class="tab-btn active" id="tab-datos" onclick="switchTab('datos')">Datos</button>
  <button class="tab-btn" id="tab-historial" onclick="switchTab('historial')">Historial</button>
  <button class="tab-btn" id="tab-estadisticas" onclick="switchTab('estadisticas')">Estad&#237;sticas</button>
</div>

<!-- PANEL DATOS -->
<div class="tab-panel active" id="panel-datos">
  <div class="content">
    <div class="avatar-wrap"><div class="avatar" id="avatar">?</div></div>

    <div class="section-label">Datos personales</div>
    <div class="card">
      <div class="field-row"><div class="field-label">Nombre</div><input class="field-input" id="inp-name" type="text" placeholder="Ej: Carlos" autocomplete="given-name" oninput="updateAvatar()"></div>
      <div class="field-row"><div class="field-label">Apellido <span class="opt">(opcional)</span></div><input class="field-input" id="inp-surname" type="text" placeholder="Ej: Garc&#237;a" autocomplete="family-name" oninput="updateAvatar()"></div>
      <div class="field-row"><div class="field-label">Sexo</div><div class="sex-row"><button class="sex-btn" onclick="setSex(this,'M')">Masculino</button><button class="sex-btn" onclick="setSex(this,'F')">Femenino</button><button class="sex-btn" onclick="setSex(this,'O')">Otro</button></div></div>
    </div>

    <div class="section-label">Categor&#237;as</div>
    <div class="card">
      <div class="field-row">
        <div class="field-label">Modalidades en las que compite</div>
        <div class="cat-row">
          <button class="cat-btn k1" onclick="toggleCat(this,'K1')">K1</button>
          <button class="cat-btn c1" onclick="toggleCat(this,'C1')">C1</button>
          <button class="cat-btn kxc" onclick="toggleCat(this,'KXC')">KXC</button>
        </div>
        <div class="cat-desc" id="cat-desc">Selecciona al menos una modalidad</div>
      </div>
    </div>

    <div class="section-label">Acceso</div>
    <div class="card" id="access-card">
      <div class="access-row">
        <div class="mini-avatar owner" id="owner-avatar"></div>
        <div class="access-info"><div class="access-name" id="owner-name">T&#250;</div><div class="access-sub" id="owner-email"></div></div>
        <span class="badge-owner">Propietario</span>
      </div>
      <div class="access-row">
        <div class="access-info">
          <div class="access-name">Compartir con entrenador</div>
          <div class="access-sub">Por email o usuario @</div>
        </div>
        <button class="btn-add" onclick="toggleShareInput()">+ A&#241;adir</button>
      </div>
      <div class="share-input-area" id="share-input-area">
        <div class="share-input-inner">
          <input class="share-text-input" id="share-input" type="text" placeholder="email@ejemplo.com o @usuario" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')addShared()">
          <div class="share-spinner" id="share-spinner"></div>
          <button class="btn-share-confirm" id="btn-share-confirm" onclick="addShared()">A&#241;adir</button>
        </div>
        <div class="share-hint"><b>Email</b>: carlos@club.es &nbsp;&middot;&nbsp; <b>Usuario</b>: @carlos o carlos</div>
      </div>
      <div id="shared-list"></div>
    </div>

    <button class="btn-delete" id="btn-delete" style="display:none" onclick="confirmDelete()">Eliminar palista</button>
  </div>
</div>

<!-- PANEL HISTORIAL -->
<div class="tab-panel" id="panel-historial">
  <div class="content" id="hist-content">
    <div class="hist-spinner"><div class="spinner"></div></div>
  </div>
</div>

<!-- PANEL ESTADÍSTICAS -->
<div class="tab-panel" id="panel-estadisticas">
  <div class="content" id="stat-content">
    <div class="stat-spinner"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB='https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';
let _tok=null,_uid=null,_email=null,_athleteId=null,_sex=null,_cats=new Set(),_shared=[];
let _athleteName='';
const $=id=>document.getElementById(id);
function showLoad(msg='Guardando...'){$('overlay-msg').textContent=msg;$('overlay').classList.add('show');}
function hideLoad(){$('overlay').classList.remove('show');}
let _tTimer;
function toast(msg,type=''){const el=$('toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');el.classList.add('show');clearTimeout(_tTimer);_tTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function initials(name,surname){const a=name?.trim()[0]||'';const b=surname?.trim()[0]||name?.trim()[1]||'';return(a+b).toUpperCase()||'?';}
function updateAvatar(){const n=$('inp-name').value;const s=$('inp-surname').value;$('avatar').textContent=initials(n,s);}
function setSex(btn,val){_sex=val;document.querySelectorAll('.sex-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
const CAT_LABELS={K1:'Kayak',C1:'Canoa',KXC:'Kayak Cross'};
function toggleCat(btn,cat){if(_cats.has(cat)){_cats.delete(cat);btn.classList.remove('active');}else{_cats.add(cat);btn.classList.add('active');}updateCatDesc();}
function updateCatDesc(){const desc=$('cat-desc');if(_cats.size===0){desc.textContent='Selecciona al menos una modalidad';desc.style.color='#bbb';}else{desc.textContent=[..._cats].map(c=>`${c} \u2014 ${CAT_LABELS[c]}`).join('  \u00b7  ');desc.style.color='#888';}}
function toggleShareInput(){const area=$('share-input-area');const open=area.style.display==='block';area.style.display=open?'none':'block';if(!open)$('share-input').focus();}

/* ── TABS ── */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  $('tab-'+name).classList.add('active');
  $('panel-'+name).classList.add('active');
  if(name==='historial'&&!_histLoaded)loadHistorial();
  if(name==='estadisticas'&&!_statLoaded)loadEstadisticas();
  $('btn-save').style.display=(name==='historial'||name==='estadisticas')?'none':'block';
}

/* ── HISTORIAL ── */
let _histLoaded=false;
function fmtTime(ms){if(!ms&&ms!==0)return'\u2014';const total=Math.floor(ms/100),dec=total%10,secs=Math.floor(total/10)%60,mins=Math.floor(total/600);return`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${dec}`;}

async function loadHistorial(){
  const container=$('hist-content');
  container.innerHTML='<div class="hist-spinner"><div class="spinner"></div></div>';
  try{
    const sessions=await api('/rest/v1/sessions?user_id=eq.'+_uid+'&order=created_at.desc&select=id,name,lugar,data,created_at');
    if(!sessions||sessions.length===0){
      container.innerHTML='<div class="empty-state"><p>Sin sesiones registradas</p></div>';
      _histLoaded=true;return;
    }
    const sesIds=sessions.map(s=>s.id);
    const entries=await api('/rest/v1/session_entries?session_id=in.('+sesIds.join(',')+')'+'&pal_name=eq.'+encodeURIComponent(_athleteName)+'&select=session_id,ms,pen,dsq,tramo,manga');

    const sesMap={};
    for(const e of entries){
      if(!sesMap[e.session_id])sesMap[e.session_id]={entries:[]};
      sesMap[e.session_id].entries.push(e);
    }

    const activeSessions=sessions.filter(s=>sesMap[s.id]);
    if(!activeSessions.length){
      container.innerHTML='<div class="empty-state"><p>Este palista no ha participado en ninguna sesi\u00f3n a\u00fan</p></div>';
      _histLoaded=true;return;
    }

    let html='';
    for(const s of activeSessions){
      const ents=sesMap[s.id].entries;
      const valid=ents.filter(e=>!e.dsq&&e.ms>0);
      const nDsq=ents.filter(e=>e.dsq).length;
      const bestNet=valid.length?Math.min(...valid.map(e=>e.ms+e.pen)):null;
      const bestEntry=bestNet!==null?valid.find(e=>e.ms+e.pen===bestNet):null;
      const fecha=s.data?new Date(s.data+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}):'';
      const sub=[s.lugar,fecha].filter(Boolean).join(' \u00b7 ');
      const nTiempos=ents.length;
      const subInfo=[sub,nTiempos+(nTiempos===1?' tiempo':' tiempos'),nDsq>0?nDsq+' DSQ':null].filter(Boolean).join(' \u00b7 ');
      const bestHtml=bestEntry
        ?`<div class="ses-best">${fmtTime(bestEntry.ms+(bestEntry.pen||0))}</div><div class="ses-best-lbl">T${bestEntry.tramo+1} \u00b7 mejor</div>`
        :nDsq===nTiempos?`<div class="ses-best" style="color:#A32D2D;font-size:14px;font-family:inherit;font-weight:800">DSQ</div><div class="ses-best-lbl">todos</div>`
        :`<div class="ses-best" style="color:#ccc">\u2014</div>`;
      html+=`<div class="ses-card">
        <div class="ses-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12,6 12,12 16,14"/></svg></div>
        <div class="ses-info"><div class="ses-name">${s.name}</div><div class="ses-sub">${subInfo||'Sin metadatos'}</div></div>
        <div style="text-align:right;flex-shrink:0">${bestHtml}</div>
      </div>`;
    }
    container.innerHTML=html;
    _histLoaded=true;
  }catch(e){
    container.innerHTML='<div class="empty-state"><p>Error al cargar el historial</p></div>';
    toast('Error: '+e.message,'err');
  }
}

/* ── ESTADÍSTICAS ── */
let _statLoaded=false;
let _statFilter='all';
let _statRaw=null;

async function loadEstadisticas(){
  const container=$('stat-content');
  container.innerHTML='<div class="stat-spinner"><div class="spinner"></div></div>';
  try{
    // Sesiones del usuario, ordenadas cronológicamente
    const sessions=await api('/rest/v1/sessions?user_id=eq.'+_uid+'&order=data.asc,created_at.asc&select=id,name,lugar,data,created_at');
    if(!sessions||!sessions.length){
      container.innerHTML='<div class="empty-state"><p>Sin sesiones registradas</p></div>';
      _statLoaded=true;return;
    }
    const sesIds=sessions.map(s=>s.id);

    // Tiempos del palista: filtrar por pal_name directamente en la query
    const entries=await api(
      '/rest/v1/session_entries'
      +'?session_id=in.('+sesIds.join(',')+')'  
      +'&pal_name=eq.'+encodeURIComponent(_athleteName)
      +'&select=session_id,tramo,manga,ms,pen,dsq,cnt2,cnt50'
    );

    if(!entries||!entries.length){
      container.innerHTML='<div class="empty-state"><p>Este palista no tiene tiempos registrados a\u00fan</p></div>';
      _statLoaded=true;return;
    }

    // Normalizar nombres de campo para compatibilidad con renderEstadisticas
    // session_entries usa: tramo, manga, ms, pen, dsq
    // renderEstadisticas espera: tramo_index -> usamos tramo directamente
    const myTimes=entries.map(e=>({...e,tramo_index:e.tramo}));

    const sesById={};
    sessions.forEach(s=>{sesById[s.id]=s;});

    _statRaw={sessions,sesById,myTimes};
    renderEstadisticas();
    _statLoaded=true;
  }catch(e){
    container.innerHTML='<div class="empty-state"><p>Error al cargar estad\u00eddsticas</p></div>';
    toast('Error: '+e.message,'err');
  }
}

function renderEstadisticas(){
  if(!_statRaw)return;
  const {sessions,sesById,myTimes}=_statRaw;
  const container=$('stat-content');

  // Tramos únicos
  const tramoSet=new Set(myTimes.map(t=>t.tramo_index));
  const tramos=[...tramoSet].sort((a,b)=>a-b);

  // Filtrado
  const filtered=_statFilter==='all'?myTimes:myTimes.filter(t=>t.tramo_index===parseInt(_statFilter));

  const valid=filtered.filter(t=>!t.dsq&&t.ms>0);
  const nets=valid.map(t=>t.ms+(t.pen||0));
  const total=filtered.length;
  const nDsq=filtered.filter(t=>t.dsq).length;
  const nValid=valid.length;
  const bestNet=nets.length?Math.min(...nets):null;
  const avgNet=nets.length?Math.round(nets.reduce((a,b)=>a+b,0)/nets.length):null;
  const dsqPct=total>0?Math.round(nDsq/total*100):0;

  // Penalizaciones: usar cnt2/cnt50 si existen, si no inferir de pen
  const nClean=valid.filter(t=>!t.pen||t.pen===0).length;
  const pen2=valid.reduce((acc,t)=>acc+(t.cnt2||0),0)||valid.filter(t=>t.pen>0&&t.pen<50).length;
  const pen50=valid.reduce((acc,t)=>acc+(t.cnt50||0),0)||valid.filter(t=>t.pen>=50).length;

  // Filtros pill
  let filterHtml=`<div class="filter-row">`;
  filterHtml+=`<button class="filter-btn${_statFilter==='all'?' active':''}" onclick="setStatFilter('all')">Todos los tramos</button>`;
  tramos.forEach(ti=>{
    filterHtml+=`<button class="filter-btn${_statFilter===String(ti)?' active':''}" onclick="setStatFilter('${ti}')">Tramo ${ti+1}</button>`;
  });
  filterHtml+='</div>';

  // KPIs
  const kpiHtml=`
  <div class="stat-grid">
    <div class="stat-box">
      <div class="stat-label">Mejor tiempo neto</div>
      <div class="stat-val green${bestNet!==null&&fmtTime(bestNet).length>7?' small':''}">${bestNet!==null?fmtTime(bestNet):'\u2014'}</div>
      <div class="stat-sub">Tiempo + penalizaciones</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Promedio neto</div>
      <div class="stat-val${avgNet!==null&&fmtTime(avgNet).length>7?' small':''}">${avgNet!==null?fmtTime(avgNet):'\u2014'}</div>
      <div class="stat-sub">${nValid} mangas v\u00e1lidas</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Total mangas</div>
      <div class="stat-val">${total}</div>
      <div class="stat-sub">${nDsq} DSQ \u00b7 ${nValid} v\u00e1lidas</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">% DSQ</div>
      <div class="stat-val${dsqPct>30?' red':dsqPct>10?' small':''}">${dsqPct}<span style="font-size:18px">%</span></div>
      <div class="stat-sub">${nDsq} de ${total} mangas</div>
    </div>
  </div>`;

  // Tabla por tramo (solo si hay más de uno)
  let tramoHtml='';
  if(tramos.length>1){
    let rows='';
    tramos.forEach(ti=>{
      const tT=myTimes.filter(t=>t.tramo_index===ti);
      const tV=tT.filter(t=>!t.dsq&&t.ms>0);
      const tN=tV.map(t=>t.ms+(t.pen||0));
      const tBest=tN.length?Math.min(...tN):null;
      const tAvg=tN.length?Math.round(tN.reduce((a,b)=>a+b,0)/tN.length):null;
      const tDsq=tT.filter(t=>t.dsq).length;
      rows+=`<tr>
        <td style="font-weight:700;color:#1B3A5C">Tramo ${ti+1}</td>
        <td class="time best-time">${tBest!==null?fmtTime(tBest):'\u2014'}</td>
        <td class="avg">${tAvg!==null?fmtTime(tAvg):'\u2014'}</td>
        <td style="font-size:13px;color:#666">${tT.length}<span style="color:#A32D2D;font-size:11px;margin-left:4px">${tDsq>0?'('+tDsq+' DSQ)':''}</span></td>
      </tr>`;
    });
    tramoHtml=`
    <div class="section-label">Por tramo</div>
    <div class="card">
      <table class="tramo-table">
        <thead><tr><th>Tramo</th><th>Mejor</th><th>Promedio</th><th>Mangas</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  // Progreso temporal
  const sesSorted=sessions.filter(s=>
    myTimes.some(t=>t.session_id===s.id&&!t.dsq&&t.ms>0&&(_statFilter==='all'||t.tramo_index===parseInt(_statFilter)))
  );
  let progHtml='';
  if(sesSorted.length>1){
    const progData=sesSorted.slice(-10).map(s=>{
      const sTimes=myTimes.filter(t=>t.session_id===s.id&&!t.dsq&&t.ms>0&&(_statFilter==='all'||t.tramo_index===parseInt(_statFilter)));
      const sNets=sTimes.map(t=>t.ms+(t.pen||0));
      const sBest=sNets.length?Math.min(...sNets):null;
      const label=s.data?new Date(s.data+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):s.name.slice(0,10);
      return{label,best:sBest,name:s.name};
    }).filter(d=>d.best!==null);
    if(progData.length>1){
      const allBests=progData.map(d=>d.best);
      const minBest=Math.min(...allBests),maxBest=Math.max(...allBests);
      const range=maxBest-minBest||1;
      const progRows=progData.map(d=>{
        const pct=Math.round((1-(d.best-minBest)/range)*85+15);
        const isBest=d.best===minBest;
        return`<div class="prog-row">
          <div class="prog-date">${d.label}</div>
          <div class="prog-bar-wrap"><div class="prog-bar${isBest?' best':''}" style="width:${pct}%"></div></div>
          <div class="prog-time">${fmtTime(d.best)}</div>
        </div>`;
      }).join('');
      progHtml=`
      <div class="section-label">Progreso (\u00faltimas sesiones)</div>
      <div class="card">${progRows}</div>`;
    }
  }

  // Distribución penalizaciones
  let penHtml='';
  if(nValid>0){
    const maxVal=Math.max(nClean,pen2,pen50,nDsq,1);
    const bar=(n,label,cls='')=>{
      const w=Math.round(n/maxVal*100);
      return`<div class="pen-dist-row"><div class="pen-dist-label">${label}</div><div class="pen-dist-bar-wrap"><div class="pen-dist-bar${cls?' '+cls:''}" style="width:${w}%"></div></div><div class="pen-dist-val">${n}</div></div>`;
    };
    penHtml=`
    <div class="section-label">Penalizaciones</div>
    <div class="card">
      ${bar(nClean,'Sin pen.')}
      ${bar(pen2,'+2s (toque)','')}
      ${bar(pen50,'+50s (error)','')}
      ${bar(nDsq,'DSQ','dsq-bar')}
    </div>`;
  }

  container.innerHTML=`${filterHtml}${kpiHtml}${tramoHtml}${progHtml}${penHtml}`;
}

function setStatFilter(val){
  _statFilter=val;
  renderEstadisticas();
}

async function api(path,opts={}){const h={'apikey':KEY,'Content-Type':'application/json','Authorization':'Bearer '+_tok,...(opts.headers||{})};const r=await fetch(SB+path,{...opts,headers:h});const t=await r.text();let j;try{j=JSON.parse(t);}catch{j=t;}if(!r.ok)throw new Error(j?.message||j?.hint||JSON.stringify(j));return j;}

async function resolveIdentifier(raw){
  const val=raw.trim();
  if(!val)return null;
  const emailRx=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  if(emailRx.test(val)){
    try{const res=await api('/rest/v1/rpc/get_user_id_by_email',{method:'POST',body:JSON.stringify({p_email:val.toLowerCase()})});if(res?.user_id)return{user_id:res.user_id,display:val.toLowerCase(),type:'email'};}catch{}
    return null;
  }
  const username=val.startsWith('@')?val.slice(1):val;
  if(!username)return null;
  try{const rows=await api('/rest/v1/profiles?username=eq.'+encodeURIComponent(username.toLowerCase())+'&select=id,username,name&limit=1');if(rows&&rows.length>0){const r=rows[0];return{user_id:r.id,display:'@'+r.username,displayName:r.name||null,type:'username'};}}catch{}
  return null;
}

async function addShared(){
  const raw=$('share-input').value.trim();
  if(!raw){toast('Introduce un email o usuario @','err');return;}
  const lowerRaw=raw.toLowerCase().replace(/^@/,'');
  if(_shared.find(s=>s.display.toLowerCase().replace(/^@/,'')===lowerRaw)){toast('Ya est\u00e1 en la lista','err');return;}
  $('share-spinner').classList.add('show');$('btn-share-confirm').disabled=true;
  let resolved=null;
  try{resolved=await resolveIdentifier(raw);}finally{$('share-spinner').classList.remove('show');$('btn-share-confirm').disabled=false;}
  if(!resolved){toast('No se encontr\u00f3 ning\u00fan usuario con ese dato','err');return;}
  if(resolved.user_id===_uid){toast('Eres el propietario','err');return;}
  if(_shared.find(s=>s.user_id===resolved.user_id)){toast('Ya tiene acceso','err');return;}
  _shared.push({user_id:resolved.user_id,display:resolved.display,displayName:resolved.displayName||null,id:null});
  $('share-input').value='';$('share-input-area').style.display='none';
  renderShared();toast(resolved.display+' a\u00f1adido \u2713','ok');
}

function removeShared(userId){_shared=_shared.filter(s=>s.user_id!==userId);renderShared();}
function renderShared(){
  const list=$('shared-list');
  if(_shared.length===0){list.innerHTML='';return;}
  list.innerHTML=_shared.map(s=>{
    const label=s.displayName?`${s.displayName} <span style="color:#aaa;font-weight:400">${s.display}</span>`:s.display;
    const ini=s.display.replace('@','').slice(0,2).toUpperCase();
    return`<div class="shared-item"><div class="mini-avatar shared">${ini}</div><div class="access-info"><div class="access-name">${label}</div><div class="access-sub">Puede ver y usar en sesiones</div></div><button class="btn-revoke" onclick="removeShared('${s.user_id}')">Quitar</button></div>`;
  }).join('');
}

async function savePalista(){
  const name=$('inp-name').value.trim();
  if(!name){toast('El nombre es obligatorio','err');return;}
  if(_cats.size===0){toast('Selecciona al menos una categor\u00eda','err');return;}
  const payload={name,surname:$('inp-surname').value.trim()||null,sex:_sex,categories:[..._cats],owner_id:_uid};
  showLoad(_athleteId?'Guardando cambios...':'Creando palista...');
  $('btn-save').disabled=true;
  try{
    let athleteId=_athleteId;
    if(!athleteId){
      const res=await api('/rest/v1/athletes',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      athleteId=res[0].id;
    }else{
      await api(`/rest/v1/athletes?id=eq.${athleteId}`,{method:'PATCH',body:JSON.stringify(payload)});
    }
    await syncSharedAccess(athleteId);
    hideLoad();toast(_athleteId?'Cambios guardados':'Palista creado','ok');
    setTimeout(()=>window.location.href='athletes.html',1200);
  }catch(e){hideLoad();$('btn-save').disabled=false;toast(e.message,'err');}
}

async function syncSharedAccess(athleteId){
  let existing=[];
  try{existing=await api(`/rest/v1/athlete_access?athlete_id=eq.${athleteId}&select=id,trainer_id`);}catch{}
  for(const s of _shared){if(s.id||!s.user_id)continue;try{await api('/rest/v1/athlete_access',{method:'POST',body:JSON.stringify({athlete_id:athleteId,trainer_id:s.user_id,granted_by:_uid,can_share:true})});}catch{}}
  for(const ex of existing){if(ex.trainer_id===_uid)continue;const stillPresent=_shared.find(s=>s.user_id===ex.trainer_id);if(!stillPresent){try{await api(`/rest/v1/athlete_access?id=eq.${ex.id}`,{method:'DELETE'});}catch{}}}
}

async function confirmDelete(){
  if(!confirm('\u00bfEliminar este palista? Los tiempos registrados se conservar\u00e1n en las sesiones.'))return;
  showLoad('Eliminando...');
  try{await api(`/rest/v1/athletes?id=eq.${_athleteId}`,{method:'DELETE'});hideLoad();toast('Palista eliminado','ok');setTimeout(()=>window.location.href='athletes.html',1000);}
  catch(e){hideLoad();toast(e.message,'err');}
}

async function loadAthlete(id){
  showLoad('Cargando...');
  try{
    const rows=await api(`/rest/v1/athletes?id=eq.${id}&select=*`);
    if(!rows||rows.length===0)throw new Error('Palista no encontrado');
    const a=rows[0];
    _athleteName=(a.name+(a.surname?' '+a.surname:'')).trim();
    $('page-title').textContent=_athleteName;
    $('inp-name').value=a.name||'';
    $('inp-surname').value=a.surname||'';
    updateAvatar();
    if(a.sex){const map={M:0,F:1,O:2};const btns=document.querySelectorAll('.sex-btn');if(btns[map[a.sex]])setSex(btns[map[a.sex]],a.sex);}
    if(a.categories){a.categories.forEach(cat=>{const btn=document.querySelector(`.cat-btn.${cat.toLowerCase()}`);if(btn)toggleCat(btn,cat);});}
    const accesses=await api(`/rest/v1/athlete_access?athlete_id=eq.${id}&select=id,trainer_id`);
    for(const ac of accesses){
      if(ac.trainer_id===_uid)continue;
      try{
        const profiles=await api(`/rest/v1/profiles?id=eq.${ac.trainer_id}&select=id,username,name&limit=1`);
        if(profiles&&profiles.length>0){const p=profiles[0];_shared.push({user_id:ac.trainer_id,display:'@'+(p.username||ac.trainer_id),displayName:p.name||null,id:ac.id});continue;}
      }catch{}
      try{const res=await api('/rest/v1/rpc/get_email_by_user_id',{method:'POST',body:JSON.stringify({p_user_id:ac.trainer_id})});if(res?.email)_shared.push({user_id:ac.trainer_id,display:res.email,displayName:null,id:ac.id});}catch{}
    }
    renderShared();
    $('btn-delete').style.display='block';
    $('tabs-bar').style.display='flex';
    hideLoad();
  }catch(e){hideLoad();toast(e.message,'err');}
}

function goBack(){window.location.href='athletes.html';}

window.addEventListener('DOMContentLoaded',async()=>{
  _tok=localStorage.getItem('slt_tok');
  _uid=localStorage.getItem('slt_uid');
  _email=localStorage.getItem('slt_email');
  if(!_tok){window.location.href='index.html';return;}
  $('owner-avatar').textContent=_email?_email.slice(0,2).toUpperCase():'YO';
  $('owner-email').textContent=_email||'';
  const params=new URLSearchParams(window.location.search);
  _athleteId=params.get('id')||null;
  if(_athleteId){$('page-title').textContent='Cargando...';await loadAthlete(_athleteId);}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
