<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" href="/icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" href="/icons/splash-1125x2436.png">

<title>SLTimer — Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* ── Topbar ── */
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.slt-logo{display:flex;align-items:baseline;line-height:1}
.slt-big{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#1B3A5C;display:inline-block;position:relative;transform:skewX(-18deg);transform-origin:bottom center}
.slt-big::before{content:attr(data-l);position:absolute;top:0;left:-5px;color:inherit;opacity:.18;filter:blur(2px);transform:skewX(-6deg);pointer-events:none}
.slt-small{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#1B3A5C;display:inline-block;transform:skewX(-18deg);transform-origin:bottom center;align-self:flex-end;padding-bottom:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:0.5px solid #B5D4F4;flex-shrink:0;text-transform:uppercase}

/* ── Layout ── */
.content{padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;max-width:480px;margin:0 auto}

/* ── User card ── */
.user-card{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:#B5D4F4;color:#0C447C;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-transform:uppercase}
.user-info{flex:1;min-width:0}
.user-email{font-size:13px;font-weight:700;color:#0C447C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#378ADD;margin-top:1px}
.logout-btn{background:none;border:none;font-size:12px;font-weight:700;color:#A32D2D;cursor:pointer;padding:5px 8px;border-radius:6px;font-family:inherit;transition:background .12s}
.logout-btn:active{background:#FCEBEB}

/* ── Section label ── */
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:0 2px}

/* ── Primary action card ── */
.menu-primary{background:#185FA5;border:none;border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:opacity .12s;-webkit-tap-highlight-color:transparent;width:100%;text-align:left;font-family:inherit}
.menu-primary:active{opacity:.85}
.menu-primary-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-primary-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-primary-info{flex:1;min-width:0}
.menu-primary-title{font-size:18px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:3px}
.menu-primary-desc{font-size:12px;color:rgba(255,255,255,0.72);line-height:1.4}
.menu-primary-arrow{font-size:22px;color:rgba(255,255,255,0.45)}

/* ── List group ── */
.list-group{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.list-item+.list-item{border-top:0.5px solid #f2f2f2}
.list-item:active{background:#f7f7f7}
.list-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-icon svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.list-icon.green{background:#E1F5EE} .list-icon.green svg{stroke:#085041}
.list-icon.teal{background:#EAF3DE} .list-icon.teal svg{stroke:#3B6D11}
.list-icon.gray{background:#f0f0f0} .list-icon.gray svg{stroke:#666}
.list-icon.orange{background:#FAEEDA} .list-icon.orange svg{stroke:#854F0B}
.list-icon.red{background:#FCEBEB} .list-icon.red svg{stroke:#A32D2D}
.list-icon.blue{background:#E6F1FB} .list-icon.blue svg{stroke:#0C447C}
.list-title{font-size:15px;font-weight:600;color:#111;flex:1}
.list-badge{background:#185FA5;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px;margin-left:6px}
.list-sub{font-size:12px;color:#aaa;font-weight:400;margin-left:4px}
.list-arrow{color:#ccc;font-size:18px;flex-shrink:0}

/* ── Greeting ── */
.greeting-sub{font-size:13px;color:#888;margin-bottom:3px}
.greeting-name{font-size:22px;font-weight:700;color:#1B3A5C;letter-spacing:-0.3px}

/* ── Loading overlay ── */
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#A32D2D}
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Cargando...</p></div>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <div class="slt-logo">
    <span class="slt-big" data-l="S">S</span>
    <span class="slt-big" data-l="L">L</span>
    <span class="slt-big" data-l="T">T</span>
    <span class="slt-small">imer</span>
  </div>
  <div class="topbar-right">
    <div class="avatar" id="top-avatar"></div>
  </div>
</div>

<!-- ══ CONTENIDO ══ -->
<div class="content">

  <!-- Saludo -->
  <div>
    <div class="greeting-sub">Bienvenido/a de nuevo</div>
    <div class="greeting-name" id="greeting-name">¿Qué hacemos hoy?</div>
  </div>

  <!-- Tarjeta de usuario -->
  <div class="user-card">
    <div class="user-avatar" id="user-avatar"></div>
    <div class="user-info">
      <div class="user-email" id="user-email"></div>
      <div class="user-role">Entrenador/a</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Salir</button>
  </div>

  <!-- Acción principal -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="section-label">Principal</div>
    <button class="menu-primary" onclick="goToApp('nueva-sesion')">
      <div class="menu-primary-icon">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div>
      <div class="menu-primary-info">
        <div class="menu-primary-title">Crear Sesión</div>
        <div class="menu-primary-desc">Configura palistas, tramos y cronómetro</div>
      </div>
      <span class="menu-primary-arrow">›</span>
    </button>
  </div>

  <!-- Grupo: Mis datos -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="section-label">Mis datos</div>
    <div class="list-group">
      <button class="list-item" onclick="goToApp('historial')">
        <div class="list-icon green">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12,6 12,12 16,14"/></svg>
        </div>
        <span class="list-title">Historial de Sesiones <span class="list-badge" id="hist-badge" style="display:none"></span></span>
        <span class="list-arrow">›</span>
      </button>
      <button class="list-item" onclick="goToApp('palistas')">
        <div class="list-icon" style="background:#EAF3DE">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#3B6D11;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
        </div>
        <span class="list-title">Mis palistas <span class="list-badge" id="athletes-badge" style="display:none"></span></span>
        <span class="list-arrow">›</span>
      </button>
      <button class="list-item" onclick="goToApp('estadisticas')">
        <div class="list-icon teal">
          <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        </div>
        <span class="list-title">Estadísticas</span>
        <span class="list-arrow">›</span>
      </button>
    </div>
  </div>

  <!-- Grupo: Configuración -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="section-label">Configuración</div>
    <div class="list-group">
      <button class="list-item" onclick="goToApp('ajustes')">
        <div class="list-icon gray">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <span class="list-title">Ajustes</span>
        <span class="list-arrow">›</span>
      </button>
      <button class="list-item" onclick="goToProfile()">
        <div class="list-icon blue">
          <!-- Icono persona/perfil -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div class="list-title" style="flex:none">Mi perfil</div>
          <div class="list-sub" id="profile-username" style="display:none"></div>
        </div>
        <span class="list-arrow">›</span>
      </button>
      <button class="list-item" onclick="goToApp('ayuda')">
        <div class="list-icon red">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5"/></svg>
        </div>
        <span class="list-title">Ayuda y soporte</span>
        <span class="list-arrow">›</span>
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────────
const SB  = 'https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';

// ── Rutas de navegación ───────────────────────────────────────────────────────
const ROUTES = {
  'nueva-sesion':   'app.html',
  'historial':      'app.html?screen=s-hist',
  'palistas':       'athletes.html',
  'estadisticas':   'app.html?screen=s-hist',
  'ajustes':        'app.html?screen=s-home',
  'ayuda':          'app.html?screen=s-home',
};

// ── Estado ────────────────────────────────────────────────────────────────────
let _tok = null, _uid = null, _email = null;
let _coachId = null;

const $ = id => document.getElementById(id);

// ── UI helpers ────────────────────────────────────────────────────────────────
function showLoad(msg = 'Cargando...') {
  $('overlay-msg').textContent = msg;
  $('overlay').classList.add('show');
}
function hideLoad() {
  $('overlay').classList.remove('show');
}

let _tTimer;
function toast(msg, err = false) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', err);
  el.classList.add('show');
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function initials(email) {
  if (!email) return '?';
  const name = email.split('@')[0];
  const parts = name.split(/[._\-]/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

// ── API helper ────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const h = { 'apikey': KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (_tok) h['Authorization'] = 'Bearer ' + _tok;
  const r = await fetch(SB + path, { ...opts, headers: h });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch { j = t; }
  if (!r.ok) throw new Error(j?.message || j?.error_description || JSON.stringify(j));
  return j;
}

// ── Refrescar token ───────────────────────────────────────────────────────────────
async function refreshIfNeeded() {
  const exp = parseInt(localStorage.getItem('slt_exp') || '0');
  const ref = localStorage.getItem('slt_ref');
  if (!ref) return false;
  if (Date.now() < exp - 10 * 60 * 1000) return true;
  try {
    const d = await api('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      body: JSON.stringify({ refresh_token: ref })
    });
    _tok = d.access_token;
    localStorage.setItem('slt_tok', d.access_token);
    localStorage.setItem('slt_ref', d.refresh_token);
    localStorage.setItem('slt_exp', Date.now() + (d.expires_in || 3600) * 1000);
    return true;
  } catch {
    clearSession();
    return false;
  }
}

function clearSession() {
  ['slt_tok', 'slt_ref', 'slt_uid', 'slt_email', 'slt_exp'].forEach(k => localStorage.removeItem(k));
}

// ── Logout ──────────────────────────────────────────────────────────────────────
async function doLogout() {
  showLoad('Cerrando sesión...');
  try { await api('/auth/v1/logout', { method: 'POST' }); } catch {}
  _tok = null; _uid = null; _email = null;
  clearSession();
  window.location.href = 'index.html';
}

// ── Navegación genérica ───────────────────────────────────────────────────────────
function goToApp(section) {
  const dest = ROUTES[section];
  if (dest) window.location.href = dest;
  else toast('Sección no disponible aún', true);
}

// ── Navegación a Mi perfil ───────────────────────────────────────────────────────
function goToProfile() {
  if (_coachId) {
    window.location.href = 'coach.html?id=' + _coachId;
  } else {
    window.location.href = 'coach.html';
  }
}

// ── Cargar historial count ────────────────────────────────────────────────────────
async function loadHistCount() {
  try {
    const rows = await api('/rest/v1/sessions?user_id=eq.' + _uid + '&is_live=eq.false&select=id');
    const badge = $('hist-badge');
    if (rows && rows.length > 0) {
      badge.textContent = rows.length;
      badge.style.display = 'inline';
    }
  } catch { /* silencioso */ }
}

// ── Cargar conteo de palistas ─────────────────────────────────────────────────────
async function loadAthletesCount() {
  try {
    const owned  = await api('/rest/v1/athletes?owner_id=eq.' + _uid + '&select=id');
    const shared = await api('/rest/v1/athlete_access?trainer_id=eq.' + _uid + '&select=id');
    const total  = (owned?.length || 0) + (shared?.length || 0);
    const badge  = $('athletes-badge');
    if (total > 0) {
      badge.textContent = total;
      badge.style.display = 'inline';
    }
  } catch { /* silencioso */ }
}

// ── Cargar perfil del entrenador ───────────────────────────────────────────────────
async function loadCoachProfile() {
  try {
    const rows = await api('/rest/v1/coaches?owner_id=eq.' + _uid + '&select=id,username&limit=1');
    if (rows && rows.length > 0) {
      _coachId = rows[0].id;
      const usernameEl = $('profile-username');
      usernameEl.textContent = '@' + rows[0].username;
      usernameEl.style.display = 'block';
    }
  } catch { /* silencioso */ }
}

// ── Renderizar UI de usuario ───────────────────────────────────────────────────────
function renderUser(email) {
  const ini = initials(email);
  $('top-avatar').textContent = ini;
  $('user-avatar').textContent = ini;
  $('user-email').textContent = email;
  const name = email.split('@')[0];
  $('greeting-name').textContent = 'Hola, ' + name.charAt(0).toUpperCase() + name.slice(1) + ' 👋';
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {

  // 1. Callback OAuth de Google (hash con access_token)
  const hash = window.location.hash.substring(1);
  if (hash.includes('access_token')) {
    showLoad('Iniciando sesión...');
    const params = new URLSearchParams(hash);
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token) {
      try {
        const user = await fetch(`${SB}/auth/v1/user`, {
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + access_token }
        }).then(r => r.json());
        localStorage.setItem('slt_tok', access_token);
        localStorage.setItem('slt_ref', refresh_token || '');
        localStorage.setItem('slt_uid', user.id);
        localStorage.setItem('slt_email', user.email);
        localStorage.setItem('slt_exp', Date.now() + (parseInt(params.get('expires_in') || '3600')) * 1000);
        history.replaceState(null, '', window.location.pathname);
      } catch {
        hideLoad();
        toast('Error al iniciar sesión', true);
        setTimeout(() => window.location.href = 'index.html', 1500);
        return;
      }
    }
  }

  // 2. Comprobar sesión guardada
  _tok = localStorage.getItem('slt_tok');
  _uid = localStorage.getItem('slt_uid');
  _email = localStorage.getItem('slt_email');

  if (!_tok) {
    window.location.href = 'index.html';
    return;
  }

  showLoad('Comprobando sesión...');
  const ok = await refreshIfNeeded();
  if (!ok) {
    window.location.href = 'index.html';
    return;
  }

  hideLoad();
  renderUser(_email);
  loadHistCount();
  loadAthletesCount();
  loadCoachProfile();
});

// PWA: Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>

</body>
</html>
