<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none}
.topbar-brand img{width:28px;height:28px;border-radius:7px;display:block}
.topbar-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1B3A5C;letter-spacing:0.5px;line-height:1}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:0.5px solid #B5D4F4;flex-shrink:0;text-transform:uppercase}
/* Bell */
.bell-btn{position:relative;width:34px;height:34px;border-radius:50%;background:#f4f4f4;border:0.5px solid rgba(0,0,0,0.10);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s}
.bell-btn:active{background:#e8e8e8}
.bell-btn svg{width:17px;height:17px;fill:none;stroke:#444;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:#D97706;border-radius:50%;border:1.5px solid #fff;display:none}
.bell-dot.show{display:block}
.content{padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;max-width:480px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:0 2px}
.menu-primary{background:#185FA5;border:none;border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:opacity .12s;-webkit-tap-highlight-color:transparent;width:100%;text-align:left;font-family:inherit}
.menu-primary:active{opacity:.85}
.menu-primary.shared{background:linear-gradient(135deg,#0F6E56 0%,#0a8a6a 100%)}
.menu-primary-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-primary-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-primary-info{flex:1;min-width:0}
.menu-primary-title{font-size:18px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:3px}
.menu-primary-desc{font-size:12px;color:rgba(255,255,255,0.72);line-height:1.4}
.menu-primary-arrow{font-size:22px;color:rgba(255,255,255,0.45)}
.list-group{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.list-item+.list-item{border-top:0.5px solid #f2f2f2}
.list-item:active{background:#f7f7f7}
.list-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-icon svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.list-icon.green{background:#E1F5EE} .list-icon.green svg{stroke:#085041}
.list-icon.teal{background:#EAF3DE} .list-icon.teal svg{stroke:#3B6D11}
.list-icon.purple{background:#F0EBFB} .list-icon.purple svg{stroke:#6B21A8}
.list-icon.gray{background:#f0f0f0} .list-icon.gray svg{stroke:#666}
.list-icon.red{background:#FCEBEB} .list-icon.red svg{stroke:#A32D2D}
.list-icon.blue{background:#E6F1FB} .list-icon.blue svg{stroke:#0C447C}
.list-icon.amber{background:#FEF3C7} .list-icon.amber svg{stroke:#92400E}
.list-title{font-size:15px;font-weight:600;color:#111;flex:1}
.list-title.danger{color:#A32D2D}
.list-badge{background:#185FA5;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px;margin-left:6px}
.list-badge.amber{background:#D97706}
.list-badge.red{background:#A32D2D}
.list-badge.green{background:#0F6E56}
.list-sub{font-size:12px;color:#aaa;font-weight:400;margin-left:4px}
.list-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.greeting-sub{font-size:13px;color:#888;margin-bottom:3px}
.greeting-name{font-size:22px;font-weight:700;color:#1B3A5C;letter-spacing:-0.3px}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#A32D2D}
/* Modal unirse */
.join-bd{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.join-bd.open{display:flex}
.join-modal{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.join-title{font-size:17px;font-weight:700;color:#1B3A5C;text-align:center}
.join-sub{font-size:13px;color:#888;text-align:center;line-height:1.45}
.join-input{padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:28px;font-weight:700;font-family:'Bebas Neue',sans-serif;letter-spacing:4px;text-transform:uppercase;color:#1B3A5C;text-align:center;-webkit-appearance:none}
.join-input:focus{outline:none;border-color:#185FA5}
.join-input.err{border-color:#A32D2D;background:#FEF2F2}
/* Separador "o" */
.join-or{display:flex;align-items:center;gap:10px;color:#bbb;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.join-or:before,.join-or:after{content:'';flex:1;height:0.5px;background:#e2e2e2}
/* Botón escanear */
.join-scan{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;border:1.5px solid #185FA5;background:#f0f6fc;color:#185FA5;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.join-scan:active{background:#e3eefa}
.join-scan svg{width:19px;height:19px;fill:none;stroke:#185FA5;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.join-actions{display:flex;gap:8px}
.join-cancel{flex:1;padding:13px;border-radius:12px;border:none;background:#f0f0f0;color:#555;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.join-go{flex:2;padding:13px;border-radius:12px;border:none;background:#185FA5;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.join-go:disabled{opacity:.45;cursor:not-allowed}
/* Modal escáner QR */
.scan-bd{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
.scan-bd.open{display:flex}
.scan-header{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center;color:#fff;font-size:16px;font-weight:600;background:linear-gradient(180deg,rgba(0,0,0,0.55),transparent);z-index:2}
.scan-viewport{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan-viewport video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(68vw,280px);height:min(68vw,280px);border:3px solid rgba(255,255,255,0.9);border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,0.45)}
.scan-frame:before{content:'';position:absolute;inset:-3px;border-radius:24px;border:3px solid #0F6E56;clip-path:polygon(0 0,28% 0,28% 8%,8% 8%,8% 28%,0 28%, 0 0, 100% 0, 72% 0, 72% 8%, 92% 8%, 92% 28%, 100% 28%, 100% 100%, 72% 100%, 72% 92%, 92% 92%, 92% 72%, 100% 72%, 100% 100%, 0 100%, 28% 100%, 28% 92%, 8% 92%, 8% 72%, 0 72%);}
.scan-status{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:500;padding:0 24px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,0.6)}
.scan-cancel{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:13px 32px;border-radius:100px;border:none;background:rgba(255,255,255,0.95);color:#111;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;z-index:2}
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Cargando...</p></div>

<div class="topbar">
  <a class="topbar-brand" href="menu.html">
    <img src="icons/icon-192x192.png" alt="SLTimer">
    <span class="topbar-brand-name">SLTimer</span>
  </a>
  <div class="topbar-right">
    <button class="bell-btn" onclick="window.location.href='notifications.html'" title="Notificaciones">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="bell-dot" id="bell-dot"></div>

    <div class="avatar" id="top-avatar"></div>

</div>

<div class="content">
  <div>
    <div class="greeting-sub">Bienvenido/a de nuevo</div>
    <div class="greeting-name" id="greeting-name">&#191;Qu&#233; hacemos hoy?</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="section-label">Principal</div>

    <!-- Crear sesión -->
    <button class="menu-primary" onclick="goToApp('nueva-sesion')">

        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>

    <!-- Unirme a sesión compartida -->
    <button class="menu-primary shared" onclick="openJoinModal()">
      <div class="menu-primary-icon" style="font-size:26px;background:rgba(255,255,255,0.15)">
        &#128279;
      </div>
      <div class="menu-primary-info">
        <div class="menu-primary-title">Unirme a sesión compartida</div>
        <div class="menu-primary-desc">Escanea el QR o introduce el código del entrenador principal</div>
      </div>
      <span class="menu-primary-arrow">&#8250;</span>

  <div style="display:flex;flex-direction:column;gap:8px">

      <button class="list-item" onclick="goToApp('historial')"><div class="list-icon green"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12,6 12,12 16,14"/></svg></div><span class="list-title">Historial de Sesiones <span class="list-badge" id="hist-badge" style="display:none"></span></span><span class="list-arrow">&#8250;</span></button>
      <button class="list-item" onclick="goToApp('palistas')"><div class="list-icon" style="background:#EAF3DE"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#3B6D11;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg></div><span class="list-title">Mis palistas <span class="list-badge" id="athletes-badge" style="display:none"></span></span><span class="list-arrow">&#8250;</span></button>

      <button class="list-item" onclick="goToApp('estadisticas')"><div class="list-icon teal"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg></div><span class="list-title">Estad&#237;sticas</span><span class="list-arrow">&#8250;</span></button>
      <button class="list-item" onclick="window.location.href='notifications.html'">
        <div class="list-icon amber"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>

    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="section-label">Configuraci&#243;n</div>
    <div class="list-group">
      <button class="list-item" onclick="goToApp('ajustes')"><div class="list-icon gray"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div><span class="list-title">Ajustes</span><span class="list-arrow">&#8250;</span></button>

<div class="toast" id="toast"></div>

<!-- MODAL UNIRSE A SESIÓN COMPARTIDA -->
<div class="join-bd" id="join-bd" onclick="if(event.target===this)closeJoinModal()">
  <div class="join-modal">
    <div class="join-title">Unirme a sesi&#243;n compartida</div>
    <div class="join-sub">Escanea el QR del entrenador principal o introduce el c&#243;digo de 6 caracteres</div>
    <button class="join-scan" onclick="openScanner()">
      <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      Escanear QR
    </button>
    <div class="join-or">o</div>
    <input class="join-input" id="join-code" type="text" maxlength="6" placeholder="ABC123"
      autocomplete="off" autocorrect="off" spellcheck="false" oninput="onJoinInput()">
    <div class="join-actions">
      <button class="join-cancel" onclick="closeJoinModal()">Cancelar</button>
      <button class="join-go" id="join-go" disabled onclick="doJoin()">Unirme &#8594;</button>
    </div>
  </div>
</div>

<!-- MODAL ESCÁNER QR -->
<div class="scan-bd" id="scan-bd">
  <div class="scan-header">Apunta al QR de la sesi&#243;n</div>
  <div class="scan-viewport">
    <video id="scan-video" playsinline muted></video>
    <div class="scan-frame"></div>
  </div>
  <div class="scan-status" id="scan-status">Buscando c&#243;digo&#8230;</div>
  <button class="scan-cancel" onclick="closeScanner()">Cancelar</button>
</div>

<script src="jsQR.min.js"></script>
<script>
const SB='https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';
const ROUTES={
  'nueva-sesion':'app.html',
  'historial':'historial.html',
  'palistas':'athletes.html',
  'grupos':'teams.html',
  'estadisticas':'stats.html',
  'ajustes':'ajustes.html'
};
let _tok=null,_uid=null,_email=null,_coachId=null,_coachName=null;
const $=id=>document.getElementById(id);
function showLoad(msg='Cargando...'){$('overlay-msg').textContent=msg;$('overlay').classList.add('show');}
function hideLoad(){$('overlay').classList.remove('show');}
let _tTimer;
function toast(msg,err=false){const el=$('toast');el.textContent=msg;el.classList.toggle('err',err);el.classList.add('show');clearTimeout(_tTimer);_tTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function initials(str){if(!str)return'?';const parts=str.trim().split(/[\s._\-]+/);if(parts.length>=2)return(parts[0][0]+parts[1][0]).toUpperCase();return str.slice(0,2).toUpperCase();}
async function api(path,opts={}){const h={'apikey':KEY,'Content-Type':'application/json',...(opts.headers||{})};if(_tok)h['Authorization']='Bearer '+_tok;const r=await fetch(SB+path,{...opts,headers:h});const t=await r.text();let j;try{j=JSON.parse(t);}catch{j=t;}if(!r.ok)throw new Error(j?.message||j?.error_description||JSON.stringify(j));return j;}
async function refreshIfNeeded(){const exp=parseInt(localStorage.getItem('slt_exp')||'0');const ref=localStorage.getItem('slt_ref');if(!ref)return false;if(Date.now()<exp-10*60*1000)return true;try{const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:ref})});_tok=d.access_token;localStorage.setItem('slt_tok',d.access_token);localStorage.setItem('slt_ref',d.refresh_token);localStorage.setItem('slt_exp',Date.now()+(d.expires_in||3600)*1000);return true;}catch{clearSession();return false;}}
function clearSession(){['slt_tok','slt_ref','slt_uid','slt_email','slt_exp'].forEach(k=>localStorage.removeItem(k));}
async function doLogout(){showLoad('Cerrando sesion...');try{await api('/auth/v1/logout',{method:'POST'});}catch{}_tok=null;_uid=null;_email=null;clearSession();window.location.href='index.html';}
function goToApp(section){const dest=ROUTES[section];if(dest)window.location.href=dest;else toast('Seccion no disponible aun',true);}
function goToProfile(){window.location.href=_coachId?'coach.html?id='+_coachId:'coach.html';}
async function loadHistCount(){try{const rows=await api('/rest/v1/sessions?user_id=eq.'+_uid+'&select=id');const badge=$('hist-badge');if(rows&&rows.length>0){badge.textContent=rows.length;badge.style.display='inline';}}catch{}}
async function loadAthletesCount(){try{const owned=await api('/rest/v1/athletes?owner_id=eq.'+_uid+'&select=id');const shared=await api('/rest/v1/athlete_access?trainer_id=eq.'+_uid+'&select=id');const total=(owned?.length||0)+(shared?.length||0);const badge=$('athletes-badge');if(total>0){badge.textContent=total;badge.style.display='inline';}}catch{}}
async function loadNotifBadge(){try{const res=await api('/rest/v1/rpc/get_my_notifications',{method:'POST',body:JSON.stringify({})});const nTeam=(res&&res.team_invites?res.team_invites.length:0);const nAth=(res&&res.athlete_invites?res.athlete_invites.length:0);const total=nTeam+nAth;const badge=$('notif-badge');const dot=$('bell-dot');if(total>0){badge.textContent=total;badge.style.display='inline';dot.classList.add('show');}const groupsBadge=$('groups-badge');if(nTeam>0){groupsBadge.textContent=nTeam;groupsBadge.style.display='inline';}}catch{}}
async function loadCoachProfile(){try{const rows=await api('/rest/v1/coaches?owner_id=eq.'+_uid+'&select=id,username,name&limit=1');if(rows&&rows.length>0){_coachId=rows[0].id;_coachName=rows[0].name||rows[0].username||null;const usernameEl=$('profile-username');usernameEl.textContent='@'+rows[0].username;usernameEl.style.display='block';const displayName=rows[0].name||rows[0].username;if(displayName){$('greeting-name').textContent='Hola, '+displayName+' \uD83D\uDC4B';$('top-avatar').textContent=initials(displayName);}}}catch{}}
function renderUser(email){const ini=initials(email.split('@')[0]);$('top-avatar').textContent=ini;const name=email.split('@')[0];$('greeting-name').textContent='Hola, '+name.charAt(0).toUpperCase()+name.slice(1)+' \uD83D\uDC4B';}

/* ── UNIRSE A SESIÓN COMPARTIDA ── */
function openJoinModal(){
  $('join-code').value='';
  $('join-code').classList.remove('err');
  $('join-go').disabled=true;
  $('join-bd').classList.add('open');
  setTimeout(()=>$('join-code').focus(),200);
}
function closeJoinModal(){ $('join-bd').classList.remove('open'); }
function onJoinInput(){
  const v=$('join-code').value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6);
  $('join-code').value=v;
  $('join-code').classList.remove('err');
  $('join-go').disabled=v.length!==6;
}
async function doJoin(){
  const code=$('join-code').value.trim().toUpperCase();
  if(code.length!==6)return;
  showLoad('Buscando sesi\u00f3n...');
  try{
    const rows=await api('/rest/v1/shared_sessions?code=eq.'+code+'&is_active=eq.true&select=id,session_id,created_by,code');
    if(!rows||!rows.length){
      hideLoad(); $('join-code').classList.add('err');
      toast('C\u00f3digo no encontrado o sesi\u00f3n cerrada',true); return;
    }
    const shared=rows[0];
    const sesRows=await api('/rest/v1/sessions?id=eq.'+shared.session_id+'&select=id,name,lugar,data,n_pal,n_tra,palistas,type,roll,roll_pos');
    const ses=sesRows[0];
    if(!ses){ hideLoad(); toast('Sesi\u00f3n no encontrada',true); return; }

    try{
      await api('/rest/v1/session_coaches',{method:'POST',headers:{'Prefer':'return=minimal'},
        body:JSON.stringify({session_id:ses.id,shared_session_id:shared.id,
          coach_id:_uid,coach_name:_coachName||_email})});
    }catch{}

    const cfg={name:ses.name,lugar:ses.lugar||'',fecha:ses.data,
      nPal:ses.n_pal,palistas:ses.palistas||[]};
    const sharedState={sharedSessionId:shared.id,sessionId:ses.id,code:shared.code,isOwner:false,cfg};

    if(ses.type==='kxc'){
      cfg.type='kxc'; cfg.nPuertas=ses.n_tra; cfg.roll=!!ses.roll; cfg.rollPos=(ses.roll_pos!==null&&ses.roll_pos!==undefined)?ses.roll_pos:null;
      const stored=Object.assign({},cfg,{_sessionId:ses.id});
      sessionStorage.setItem('kxc_cfg',JSON.stringify(stored));
      sessionStorage.removeItem('kxc_resume');
      sessionStorage.setItem('slt_shared',JSON.stringify(sharedState));
      hideLoad(); window.location.href='sessionkxc.html';
    }else{
      cfg.nTra=ses.n_tra;
      const stored=Object.assign({},cfg,{_sessionId:ses.id});
      sessionStorage.setItem('slalom_cfg',JSON.stringify(stored));
      sessionStorage.removeItem('slalom_resume');
      sessionStorage.setItem('slt_shared',JSON.stringify(sharedState));
      hideLoad(); window.location.href='slalom-session.html';
    }
  }catch(e){ hideLoad(); toast('Error: '+e.message,true); }
}

/* ── ESCÁNER QR (cámara) ── */
let _scanStream=null,_scanRAF=null,_scanDetector=null,_scanBusy=false;

function extractJoinCode(text){
  // Acepta tanto la URL completa (menu.html?join=CODE) como un código suelto.
  // El valor proviene de un QR externo: se sanea siempre.
  try{
    const u=new URL(text);
    const j=u.searchParams.get('join');
    if(j){ const c=j.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6); return c.length===6?c:null; }
  }catch{}
  const m=(text||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  return m.length===6?m:null;
}

async function openScanner(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Tu navegador no permite usar la c\u00e1mara',true); return;
  }
  $('scan-bd').classList.add('open');
  $('scan-status').textContent='Abriendo c\u00e1mara\u2026';
  _scanBusy=false;
  try{
    _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const video=$('scan-video');
    video.srcObject=_scanStream;
    video.setAttribute('playsinline','');
    await video.play();
    $('scan-status').textContent='Buscando c\u00f3digo\u2026';
    if('BarcodeDetector' in window){
      try{
        const fmts=await window.BarcodeDetector.getSupportedFormats();
        if(fmts.includes('qr_code')) _scanDetector=new window.BarcodeDetector({formats:['qr_code']});
      }catch{ _scanDetector=null; }
    }
    _scanRAF=requestAnimationFrame(scanLoop);
  }catch(e){
    $('scan-status').textContent='No se pudo abrir la c\u00e1mara. Revisa los permisos del navegador.';
  }
}

async function scanLoop(){
  const video=$('scan-video');
  if(_scanBusy||!video){ if(_scanStream)_scanRAF=requestAnimationFrame(scanLoop); return; }
  if(video.readyState<2){ _scanRAF=requestAnimationFrame(scanLoop); return; }

  let codeText=null;
  try{
    if(_scanDetector){
      const codes=await _scanDetector.detect(video);
      if(codes&&codes.length) codeText=codes[0].rawValue;
    }else if(typeof jsQR!=='undefined'){
      const canvas=document.createElement('canvas');
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      if(canvas.width&&canvas.height){
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const res=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(res) codeText=res.data;
      }
    }
  }catch{}

  if(codeText){
    const code=extractJoinCode(codeText);
    if(code){
      _scanBusy=true;
      $('scan-status').textContent='\u00a1C\u00f3digo detectado!';
      closeScanner();
      $('join-code').value=code;
      $('join-go').disabled=false;
      doJoin();
      return;
    }else{
      $('scan-status').textContent='Ese QR no es de una sesi\u00f3n SLTimer.';
    }
  }
  if(_scanStream) _scanRAF=requestAnimationFrame(scanLoop);
}

function closeScanner(){
  if(_scanRAF){ cancelAnimationFrame(_scanRAF); _scanRAF=null; }
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
  const video=$('scan-video');
  if(video) video.srcObject=null;
  _scanDetector=null;
  $('scan-bd').classList.remove('open');
}

window.addEventListener('DOMContentLoaded',async()=>{
  const hash=window.location.hash.substring(1);
  if(hash.includes('access_token')){showLoad('Iniciando sesion...');const params=new URLSearchParams(hash);const access_token=params.get('access_token');const refresh_token=params.get('refresh_token');if(access_token){try{const user=await fetch(`${SB}/auth/v1/user`,{headers:{'apikey':KEY,'Authorization':'Bearer '+access_token}}).then(r=>r.json());localStorage.setItem('slt_tok',access_token);localStorage.setItem('slt_ref',refresh_token||'');localStorage.setItem('slt_uid',user.id);localStorage.setItem('slt_email',user.email);localStorage.setItem('slt_exp',Date.now()+(parseInt(params.get('expires_in')||'3600'))*1000);history.replaceState(null,'',window.location.pathname);}catch{hideLoad();toast('Error al iniciar sesion',true);setTimeout(()=>window.location.href='index.html',1500);return;}}}
  _tok=localStorage.getItem('slt_tok');_uid=localStorage.getItem('slt_uid');_email=localStorage.getItem('slt_email');
  if(!_tok){window.location.href='index.html';return;}
  showLoad('Comprobando sesion...');
  const ok=await refreshIfNeeded();
  if(!ok){window.location.href='index.html';return;}
  hideLoad();
  try{
  const prof=await api('/rest/v1/coaches?owner_id=eq.'+_uid+'&select=id&limit=1');
  if(!prof||!prof.length){window.location.href='onboarding.html';return;}
}catch{}
  renderUser(_email);
  loadHistCount();
  loadAthletesCount();
  loadNotifBadge();
  loadCoachProfile();

  // Auto-unión desde QR/enlace: menu.html?join=CODIGO
  const joinCode=new URLSearchParams(location.search).get('join');
  if(joinCode){
    history.replaceState(null,'',location.pathname);
    const clean=joinCode.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6);
    if(clean.length===6){
      $('join-code').value=clean;
      $('join-go').disabled=false;
      doJoin();
    }
  }
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
