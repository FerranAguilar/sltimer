<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- PWA core -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3A5C">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLTimer">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png">

<!-- Android / General -->
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">

<title>SLTimer — Entrenador</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* ── Topbar ── */
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.back{font-size:24px;color:#666;background:none;border:none;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.back:active{opacity:.6}
.topbar h1{font-size:16px;font-weight:600;color:#111;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-save{background:#185FA5;border:none;color:#fff;font-size:14px;font-weight:600;padding:8px 18px;border-radius:10px;cursor:pointer;font-family:inherit;transition:opacity .12s;flex-shrink:0}
.btn-save:active{opacity:.8}
.btn-save:disabled{opacity:.4;cursor:not-allowed}

/* ── Layout ── */
.content{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;padding-bottom:40px}

/* ── Avatar ── */
.avatar-wrap{display:flex;justify-content:center;padding:8px 0 4px}
.avatar{width:76px;height:76px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;border:0.5px solid #B5D4F4;letter-spacing:-1px;transition:background .2s}

/* ── Section label ── */
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:0 2px}

/* ── Card ── */
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;overflow:hidden}

/* ── Field rows ── */
.field-row{padding:12px 16px;display:flex;flex-direction:column;gap:5px}
.field-row+.field-row{border-top:0.5px solid #f2f2f2}
.field-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.04em}
.field-input{border:none;outline:none;font-size:15px;color:#111;background:transparent;font-family:inherit;width:100%;padding:0;-webkit-appearance:none}
.field-input::placeholder{color:#ccc}

/* ── Username row ── */
.username-wrap{display:flex;align-items:center;gap:4px}
.username-prefix{font-size:15px;color:#aaa;font-weight:600;flex-shrink:0}
.field-input.username{color:#185FA5}
.username-hint{font-size:12px;color:#bbb;margin-top:4px}
.username-hint.error{color:#A32D2D}
.username-hint.ok{color:#0F6E56}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#A32D2D}
.toast.ok{background:#0F6E56}

/* ── Loading overlay ── */
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}

/* ── Delete button ── */
.btn-delete{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:0.5px solid #F7C1C1;background:#FCEBEB;color:#A32D2D;font-family:inherit;transition:opacity .12s}
.btn-delete:active{opacity:.75}
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Guardando...</p></div>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <button class="back" onclick="goBack()">←</button>
  <h1 id="page-title">Nuevo entrenador</h1>
  <button class="btn-save" id="btn-save" onclick="saveCoach()">Guardar</button>
</div>

<!-- ══ CONTENIDO ══ -->
<div class="content">

  <!-- Avatar generado con iniciales -->
  <div class="avatar-wrap">
    <div class="avatar" id="avatar">?</div>
  </div>

  <!-- ── Datos del entrenador ── -->
  <div class="section-label">Perfil del entrenador</div>
  <div class="card">
    <div class="field-row">
      <div class="field-label">Nombre</div>
      <input class="field-input" id="inp-name" type="text" placeholder="Ej: Marta" autocomplete="given-name" oninput="updateAvatar()">
    </div>
    <div class="field-row">
      <div class="field-label">Usuario</div>
      <div class="username-wrap">
        <span class="username-prefix">@</span>
        <input class="field-input username" id="inp-username" type="text" placeholder="nombre_usuario" autocomplete="off" oninput="validateUsername()">
      </div>
      <div class="username-hint" id="username-hint">Identificador único · solo letras, números y _</div>
    </div>
  </div>

  <!-- Botón eliminar (solo en modo edición) -->
  <button class="btn-delete" id="btn-delete" style="display:none" onclick="confirmDelete()">Eliminar entrenador</button>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────────
const SB  = 'https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';

// ── Estado ────────────────────────────────────────────────────────────────────
let _tok      = null;
let _uid      = null;
let _coachId  = null;
let _usernameValid = false;

const $ = id => document.getElementById(id);

// ── UI helpers ────────────────────────────────────────────────────────────────
function showLoad(msg = 'Guardando...') {
  $('overlay-msg').textContent = msg;
  $('overlay').classList.add('show');
}
function hideLoad() { $('overlay').classList.remove('show'); }

let _tTimer;
function toast(msg, type = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  el.classList.add('show');
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  const a = parts[0]?.[0] || '';
  const b = parts[1]?.[0] || parts[0]?.[1] || '';
  return (a + b).toUpperCase() || '?';
}

// ── Avatar dinámico ───────────────────────────────────────────────────────────
function updateAvatar() {
  const n = $('inp-name').value;
  $('avatar').textContent = n.trim() ? initials(n) : '?';
}

// ── Validación de username ────────────────────────────────────────────────────
function validateUsername() {
  const val = $('inp-username').value;
  const hint = $('username-hint');
  if (val === '') {
    hint.textContent = 'Identificador único · solo letras, números y _';
    hint.className = 'username-hint';
    _usernameValid = false;
    return;
  }
  const valid = /^[a-zA-Z0-9_]{3,30}$/.test(val);
  if (!valid) {
    hint.textContent = 'Mínimo 3 caracteres · solo letras, números y _';
    hint.className = 'username-hint error';
    _usernameValid = false;
  } else {
    hint.textContent = '@' + val + ' disponible';
    hint.className = 'username-hint ok';
    _usernameValid = true;
  }
}

// ── API helper ────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const h = {
    'apikey': KEY,
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + _tok,
    ...(opts.headers || {})
  };
  const r = await fetch(SB + path, { ...opts, headers: h });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch { j = t; }
  if (!r.ok) throw new Error(j?.message || j?.hint || JSON.stringify(j));
  return j;
}

// ── Guardar ───────────────────────────────────────────────────────────────────
async function saveCoach() {
  const name     = $('inp-name').value.trim();
  const username = $('inp-username').value.trim().toLowerCase();

  if (!name)           { toast('El nombre es obligatorio', 'err'); return; }
  if (!_usernameValid) { toast('El usuario no es válido', 'err'); return; }

  const payload = { name, username, owner_id: _uid };

  showLoad(_coachId ? 'Guardando cambios...' : 'Creando entrenador...');
  $('btn-save').disabled = true;

  try {
    if (!_coachId) {
      const existing = await api(`/rest/v1/coaches?username=eq.${username}&select=id`);
      if (existing.length > 0) {
        hideLoad();
        $('btn-save').disabled = false;
        $('username-hint').textContent = 'Este usuario ya está en uso';
        $('username-hint').className = 'username-hint error';
        _usernameValid = false;
        toast('El usuario ya está en uso', 'err');
        return;
      }
      await api('/rest/v1/coaches', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify(payload)
      });
    } else {
      await api(`/rest/v1/coaches?id=eq.${_coachId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });
    }

    hideLoad();
    toast(_coachId ? 'Cambios guardados' : 'Entrenador creado', 'ok');
    setTimeout(() => goBack(), 1200);

  } catch (e) {
    hideLoad();
    $('btn-save').disabled = false;
    toast(e.message, 'err');
  }
}

// ── Eliminar entrenador ───────────────────────────────────────────────────────
async function confirmDelete() {
  if (!confirm('¿Eliminar este entrenador?')) return;
  showLoad('Eliminando...');
  try {
    await api(`/rest/v1/coaches?id=eq.${_coachId}`, { method: 'DELETE' });
    hideLoad();
    toast('Entrenador eliminado', 'ok');
    setTimeout(() => goBack(), 1000);
  } catch (e) {
    hideLoad();
    toast(e.message, 'err');
  }
}

// ── Navegación ────────────────────────────────────────────────────────────────
function goBack() {
  window.history.length > 1 ? window.history.back() : window.location.href = 'menu.html';
}

// ── Cargar datos existentes (modo edición) ────────────────────────────────────
async function loadCoach(id) {
  showLoad('Cargando...');
  try {
    const rows = await api(`/rest/v1/coaches?id=eq.${id}&select=*`);
    if (!rows || rows.length === 0) throw new Error('Entrenador no encontrado');
    const c = rows[0];

    $('page-title').textContent = c.name;
    $('inp-name').value     = c.name     || '';
    $('inp-username').value = c.username || '';
    updateAvatar();
    validateUsername();

    $('btn-delete').style.display = 'block';
    hideLoad();
  } catch (e) {
    hideLoad();
    toast(e.message, 'err');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  _tok = localStorage.getItem('slt_tok');
  _uid = localStorage.getItem('slt_uid');

  if (!_tok) { window.location.href = 'index.html'; return; }

  const params = new URLSearchParams(window.location.search);
  _coachId = params.get('id') || null;

  if (_coachId) {
    $('page-title').textContent = 'Editar entrenador';
    await loadCoach(_coachId);
  }
});

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>

</body>
</html>
