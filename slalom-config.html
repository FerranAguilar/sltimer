<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configurar sesión · SLTimer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
    .topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e8eaed;display:flex;align-items:center;padding:0 12px;height:52px;gap:8px}
    .top-back{background:none;border:none;cursor:pointer;font-size:22px;color:#444;padding:8px;margin-left:-8px;border-radius:8px;line-height:1}
    .topbar h1{flex:1;font-size:17px;font-weight:600;color:#1a1a1a;text-align:center}
    .top-avatar{width:34px;height:34px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#1a73e8;cursor:pointer;flex-shrink:0}
    .content{max-width:480px;margin:0 auto;padding:16px 16px 100px}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .card h2{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
    label{display:block;font-size:14px;font-weight:500;color:#444;margin-bottom:4px}
    input[type=text],input[type=date]{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;background:#fafafa;transition:border .15s}
    input[type=text]:focus,input[type=date]:focus{border-color:#1a73e8;background:#fff}
    .field{margin-bottom:12px}
    .counter-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
    .counter-row label{margin:0;flex:1}
    .counter{display:flex;align-items:center;gap:0}
    .cnt-btn{width:38px;height:38px;border:1.5px solid #e0e0e0;background:#fff;border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;transition:background .12s}
    .cnt-btn:active{background:#f0f0f0}
    .cnt-val{width:44px;text-align:center;font-size:17px;font-weight:600;color:#1a1a1a}
    /* Palistas */
    .pal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .pal-item{display:flex;align-items:center;gap:8px;background:#f8f9fa;border-radius:12px;padding:8px 10px}
    .pal-num{width:24px;height:24px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1a73e8;flex-shrink:0}
    .pal-name-input{flex:1;border:none;background:transparent;font-size:14px;font-weight:500;color:#1a1a1a;outline:none;min-width:0}
    .pal-name-input::placeholder{color:#bbb}
    .pal-cat-sel{border:1px solid #e0e0e0;border-radius:8px;padding:4px 6px;font-size:12px;color:#555;background:#fff;cursor:pointer;flex-shrink:0;max-width:90px}
    .pal-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;padding:2px 4px;border-radius:6px;transition:color .12s;flex-shrink:0}
    .pal-del:active{color:#e53935}
    .pal-drag{background:none;border:none;cursor:grab;color:#ccc;font-size:16px;padding:2px 4px;flex-shrink:0}
    .add-pal-row{display:flex;gap:8px;flex-wrap:wrap}
    .btn-add-pal{flex:1;min-width:120px;background:#f0f4ff;border:1.5px dashed #b0c4f8;border-radius:10px;padding:10px;font-size:14px;font-weight:500;color:#1a73e8;cursor:pointer;transition:background .12s}
    .btn-add-pal:active{background:#e3eaff}
    .btn-add-team{flex:1;min-width:120px;background:#f0fff4;border:1.5px dashed #a8d5b5;border-radius:10px;padding:10px;font-size:14px;font-weight:500;color:#2e7d32;cursor:pointer;transition:background .12s}
    .btn-add-team:active{background:#e0f7e5}
    .btn-add-athlete{flex:1;min-width:120px;background:#fff8e1;border:1.5px dashed #ffc77a;border-radius:10px;padding:10px;font-size:14px;font-weight:500;color:#e65100;cursor:pointer;transition:background .12s}
    .btn-add-athlete:active{background:#fff0c2}
    .start-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#1a73e8;color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(26,115,232,.35);transition:background .15s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .start-btn:active{background:#1557b0}
    .start-btn:disabled{opacity:.6;cursor:not-allowed}
    .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;white-space:nowrap;max-width:calc(100% - 40px);text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.err{background:#c62828}
    .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:12px}
    .loading-spinner{width:36px;height:36px;border:3px solid #e8eaed;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite}
    .loading-text{font-size:14px;color:#666}
    /* Athletes sheet */
    .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none;align-items:flex-end}
    .sheet-overlay.open{display:flex}
    .sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
    .sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 4px}
    .sheet-title{font-size:16px;font-weight:700;color:#1a1a1a;text-align:center}
    .sheet-search{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:9px 12px;font-size:15px;outline:none;background:#fafafa}
    .sheet-search:focus{border-color:#1a73e8}
    .ath-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f0f0f0;cursor:pointer;border-radius:8px;transition:background .1s}
    .ath-item:active{background:#f5f5f5}
    .ath-avatar{width:36px;height:36px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#1a73e8;flex-shrink:0}
    .ath-info{flex:1;min-width:0}
    .ath-name{font-size:14px;font-weight:600;color:#1a1a1a}
    .ath-cat{font-size:12px;color:#888}
    /* Groups sheet */
    .group-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f0f0f0;cursor:pointer;border-radius:8px;transition:background .1s}
    .group-item:active{background:#f5f5f5}
    .group-icon{width:36px;height:36px;border-radius:10px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .group-info{flex:1;min-width:0}
    .group-name{font-size:14px;font-weight:600;color:#1a1a1a}
    .group-count{font-size:12px;color:#888}
    .cat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .cat-btn{padding:5px 14px;border-radius:20px;border:1.5px solid #e0e0e0;background:#fff;font-size:13px;color:#555;cursor:pointer;transition:all .12s;font-family:inherit}
    .cat-btn.active{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600}
    /* Palista category wrapper */
    .spal-cat-wrap{display:none;flex-wrap:wrap;gap:5px;padding:4px 0 4px 32px}
    .spal-cat-wrap.open{display:flex}
    .spal-cat-btn{padding:3px 10px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;color:#555;cursor:pointer;transition:all .12s;font-family:inherit}
    .spal-cat-btn.active{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600}
    .pal-cat-toggle{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;color:#999;flex-shrink:0;transition:transform .15s}
    .pal-cat-toggle.open{transform:rotate(180deg)}
  </style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Cargando...</div>
</div>

<div class="topbar">
  <button class="top-back" onclick="window.location.href='menu.html'">&#8592;</button>
  <h1>Nueva sesión</h1>
  <div class="top-avatar" id="top-avatar" onclick="window.location.href='ajustes.html'">?</div>
</div>

<div class="content">
  <!-- Info sesión -->
  <div class="card">
    <h2>Información</h2>
    <div class="field">
      <label for="cfg-name">Nombre de la sesión</label>
      <input type="text" id="cfg-name" placeholder="Ej: Entreno matinal" autocomplete="off" maxlength="60">
    </div>
    <div class="field">
      <label for="cfg-lugar">Lugar (opcional)</label>
      <input type="text" id="cfg-lugar" placeholder="Ej: Río Segre" autocomplete="off" maxlength="60">
    </div>
    <div class="field">
      <label for="cfg-fecha">Fecha</label>
      <input type="date" id="cfg-fecha">
    </div>
  </div>

  <!-- Config tramos -->
  <div class="card">
    <h2>Configuración</h2>
    <div class="counter-row">
      <label>Número de tramos</label>
      <div class="counter">
        <button class="cnt-btn" onclick="stepCfg('tra',-1)">−</button>
        <span class="cnt-val" id="val-tra">6</span>
        <button class="cnt-btn" onclick="stepCfg('tra',1)">+</button>
      </div>
    </div>
  </div>

  <!-- Palistas -->
  <div class="card">
    <h2>Palistas</h2>
    <div class="pal-list" id="pal-list"></div>
    <div class="add-pal-row">
      <button class="btn-add-pal" onclick="addPalista()">+ Añadir palista</button>
      <button class="btn-add-athlete" onclick="openAthleteSheet()">+ Desde atletas</button>
      <button class="btn-add-team" onclick="openGroupSheet()">+ Desde grupo</button>
    </div>
  </div>
</div>

<button class="start-btn" id="start-btn" onclick="startSession()">Iniciar sesión</button>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SB='https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';

const MAX={tra:20,pal:20};
const CFG={tra:6};
let _tok=null,_uid=null,_email=null,_athletes=[],_palState=[],_teams=[];

function initials(e){return(e||'?').split('@')[0].slice(0,2).toUpperCase();}
function toast(msg,type='',dur=2200){const t=$('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');void t.offsetWidth;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}

async function api(path,opts={}){
  const r=await fetch(SB+path,{...opts,headers:{'apikey':KEY,'Authorization':'Bearer '+_tok,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  const txt=await r.text();return txt?JSON.parse(txt):null;
}

function stepCfg(key,d){
  const min=1,max=MAX[key]||20;
  CFG[key]=Math.min(max,Math.max(min,(CFG[key]||1)+d));
  $('val-'+key).textContent=CFG[key];
}

/* ── GRUPOS SHEET — igual que add-group-patch.js ── */
async function loadTeams(){
  try{
    const members=await api('/rest/v1/team_members?select=team_id,teams(id,name)&user_id=eq.'+_uid);
    if(!members||!members.length){_teams=[];return;}
    const results=[];
    for(const m of members){
      const team=m.teams;if(!team)continue;
      const rows=await api('/rest/v1/team_athletes?select=athletes(id,name,surname,categories)&team_id=eq.'+team.id);
      const athletes=(rows||[]).map(r=>r.athletes).filter(Boolean);
      results.push({id:team.id,name:team.name,athletes});
    }
    _teams=results;
  }catch(e){console.warn('No se pudieron cargar grupos:',e);_teams=[];}
}

function openGroupSheet(){
  const overlay=document.createElement('div');
  overlay.className='sheet-overlay open';
  overlay.id='group-sheet-overlay';
  overlay.innerHTML=`
    <div class="sheet" id="group-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Añadir desde grupo</div>
      <div id="group-list"></div>
    </div>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
  const list=$('group-list');
  if(!_teams||!_teams.length){
    list.innerHTML='<p style="color:#aaa;text-align:center;padding:20px;font-size:14px">No tienes grupos creados</p>';
    return;
  }
  _teams.forEach(team=>{
    const d=document.createElement('div');
    d.className='group-item';
    d.innerHTML=`<div class="group-icon">👥</div><div class="group-info"><div class="group-name">${team.name}</div><div class="group-count">${team.athletes.length} atleta${team.athletes.length!==1?'s':''}</div></div>`;
    d.onclick=()=>{
      team.athletes.forEach(a=>{
        if(!_palState.find(p=>p.id&&p.id===a.id)){
          _palState.push({id:a.id,name:(a.name||'')+(a.surname?' '+a.surname:''),category:a.categories?.[0]||null,isTemp:false});
        }
      });
      buildPalList();
      overlay.remove();
      toast('Grupo añadido','',1500);
    };
    list.appendChild(d);
  });
}

/* ── ATHLETES SHEET ── */
function openAthleteSheet(){
  const overlay=document.createElement('div');
  overlay.className='sheet-overlay open';
  overlay.id='ath-sheet-overlay';
  overlay.innerHTML=`
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Añadir atleta</div>
      <input class="sheet-search" id="ath-search" placeholder="Buscar atleta…" autocomplete="off">
      <div id="ath-list"></div>
    </div>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
  let filtered=[..._athletes];
  function render(){
    const list=$('ath-list');
    if(!list)return;
    list.innerHTML='';
    if(!filtered.length){list.innerHTML='<p style="color:#aaa;text-align:center;padding:20px;font-size:14px">Sin resultados</p>';return;}
    filtered.slice(0,40).forEach(a=>{
      const inList=_palState.some(p=>p.id&&p.id===a.id);
      const d=document.createElement('div');
      d.className='ath-item';
      d.style.opacity=inList?'0.4':'1';
      const ini=((a.name||'')[0]||'?').toUpperCase();
      const cats=(a.categories||[]).join(', ');
      d.innerHTML=`<div class="ath-avatar">${ini}</div><div class="ath-info"><div class="ath-name">${a.name||''} ${a.surname||''}</div><div class="ath-cat">${cats||'Sin categoría'}</div></div>`;
      if(!inList){
        d.onclick=()=>{
          _palState.push({id:a.id,name:(a.name||'')+(a.surname?' '+a.surname:''),category:a.categories?.[0]||null,isTemp:false});
          buildPalList();
          overlay.remove();
        };
      }
      list.appendChild(d);
    });
  }
  render();
  setTimeout(()=>{
    const inp=$('ath-search');
    if(inp){
      inp.focus();
      inp.addEventListener('input',()=>{
        const q=inp.value.toLowerCase().trim();
        filtered=q?_athletes.filter(a=>((a.name||'')+(a.surname||'')).toLowerCase().includes(q)):_athletes;
        render();
      });
    }
  },50);
}

/* ── PAL LIST ── */
const CATS=['K1','C1','K2','C2','K4','KL','VK'];

function buildPalList(){
  const list=$('pal-list');
  list.innerHTML='';
  _palState.forEach((p,i)=>{
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;gap:0';
    const row=document.createElement('div');
    row.className='pal-item';

    const numEl=document.createElement('div');
    numEl.className='pal-num';numEl.textContent=i+1;

    const nameEl=document.createElement('input');
    nameEl.className='pal-name-input';nameEl.type='text';
    nameEl.placeholder='Nombre palista';nameEl.value=p.name;
    nameEl.addEventListener('input',()=>{_palState[i].name=nameEl.value;});

    const catToggle=document.createElement('button');
    catToggle.className='pal-cat-toggle'+(p.category?' open':'');
    catToggle.innerHTML=p.category?`<span style="font-size:11px;background:#e8f0fe;color:#1a73e8;border-radius:10px;padding:2px 7px;font-weight:600">${p.category}</span>`:'🏷';
    catToggle.title='Categoría';
    catToggle.onclick=()=>{
      const cw=wrap.querySelector('.spal-cat-wrap');
      if(cw){cw.classList.toggle('open');catToggle.classList.toggle('open',cw.classList.contains('open'));}
    };

    const delBtn=document.createElement('button');
    delBtn.className='pal-del';delBtn.textContent='×';delBtn.title='Eliminar';
    delBtn.onclick=()=>{_palState.splice(i,1);buildPalList();};

    row.append(numEl,nameEl,catToggle,delBtn);
    wrap.appendChild(row);

    const catWrap=document.createElement('div');
    catWrap.className='spal-cat-wrap'+(p.category?' open':'');
    catWrap.id='spal-cat-wrap-'+i;
    CATS.forEach(c=>{
      const b=document.createElement('button');
      b.className='spal-cat-btn cat-btn'+(p.category===c?' active':'');
      b.textContent=c;
      b.onclick=()=>{
        _palState[i].category=(_palState[i].category===c)?null:c;
        buildPalList();
      };
      catWrap.appendChild(b);
    });
    wrap.appendChild(catWrap);
    list.appendChild(wrap);
  });
}

function setPalCatUI(i,cat){
  const w=$('spal-cat-wrap-'+i);if(!w)return;
  w.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.classList.contains(cat)));
}

async function startSession(){
  const name=$('cfg-name').value.trim();
  if(!name){toast('Introduce un nombre para la sesión','err');return;}
  if(_palState.length===0){toast('Añade al menos un palista','err');return;}

  const btn=$('start-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Creando sesión…';

  const lugar=$('cfg-lugar').value.trim();
  const fecha=$('cfg-fecha').value||new Date().toISOString().slice(0,10);
  const palistas=_palState.map((s,i)=>({name:s.name.trim()||'Palista '+(i+1),category:s.category,id:s.id||null,isTemp:s.isTemp||false}));

  try{
    // Refrescar token antes de crear la sesión
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
    const sb=createClient(SB,KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(!session){window.location.href='index.html';return;}
    _tok=session.access_token;

    const row=await api('/rest/v1/sessions?select=id',{
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({
        name,
        lugar:lugar||null,
        fecha,
        n_palistas:palistas.length,
        n_tramos:CFG.tra,
        palistas,
        user_id:_uid,
        status:'active'
      })
    });
    const sessionId=Array.isArray(row)?row[0]?.id:row?.id;
    if(!sessionId)throw new Error('No se recibió ID de sesión');

    sessionStorage.setItem('slalom_cfg',JSON.stringify({name,lugar,fecha,nPal:palistas.length,nTra:CFG.tra,palistas}));
    window.location.href='slalom-session.html?id='+sessionId;
  }catch(e){
    console.error('Error creando sesión:',e);
    toast('Error al crear la sesión. Inténtalo de nuevo.','err',3000);
    btn.disabled=false;
    btn.textContent='Iniciar sesión';
  }
}

async function addPalista(name='',cat=null,id=null,isTemp=false){
  if(_palState.length>=MAX.pal){toast('Máximo '+MAX.pal+' palistas','err');return;}
  _palState.push({id,name,category:cat,isTemp});
  buildPalList();
  setTimeout(()=>{
    const inputs=$('pal-list').querySelectorAll('.pal-name-input');
    if(inputs.length)inputs[inputs.length-1].focus();
  },50);
}

async function init(){
  $('loading-overlay').style.display='flex';
  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
    const sb=createClient(SB,KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(!session){window.location.href='index.html';return;}
    _tok=session.access_token;_uid=session.user.id;_email=session.user.email;
    // Mantener localStorage actualizado para compatibilidad con otras páginas
    localStorage.setItem('slt_tok',_tok);localStorage.setItem('slt_uid',_uid);localStorage.setItem('slt_email',_email);
    $('top-avatar').textContent=initials(_email||'?');
    try{
      const ats=await api('/rest/v1/athletes?select=id,name,surname,categories&order=name.asc');
      _athletes=ats||[];
    }catch(atsErr){
      console.warn('No se pudieron cargar atletas:',atsErr);
      _athletes=[];
    }
    await loadTeams();
    const cfgRaw=sessionStorage.getItem('slalom_cfg');
    if(cfgRaw){
      const cfg=JSON.parse(cfgRaw);
      if(cfg.name)$('cfg-name').value=cfg.name;
      if(cfg.lugar)$('cfg-lugar').value=cfg.lugar;
      if(cfg.fecha)$('cfg-fecha').value=cfg.fecha;
      if(cfg.nTra){CFG.tra=cfg.nTra;$('val-tra').textContent=cfg.nTra;}
      if(cfg.palistas&&cfg.palistas.length){
        _palState=cfg.palistas.map(p=>({id:p.id||null,name:p.name||'',category:p.category||null,isTemp:p.isTemp||false}));
      }
    }
    $('cfg-fecha').value=$('cfg-fecha').value||new Date().toISOString().slice(0,10);
    buildPalList();
  }catch(e){
    console.error(e);
    toast('Error al cargar','err');
  }finally{
    $('loading-overlay').style.display='none';
  }
}

init();
</script>
</body>
</html>
