<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configurar Sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f0;
      min-height: 100vh;
      color: #1a2e1a;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(135deg, #1a3a2a 0%, #0d5c3a 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .topbar-right { width: 36px; }

    /* MAIN */
    .main { padding: 16px; max-width: 480px; margin: 0 auto; padding-bottom: 32px; }

    /* SECTION CARD */
    .section-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #0d5c3a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    /* FORM FIELDS */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d0ddd0;
      border-radius: 10px;
      font-size: 15px;
      color: #1a2e1a;
      background: #f8faf8;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #0d5c3a;
      box-shadow: 0 0 0 3px rgba(13,92,58,0.12);
      background: white;
    }

    /* TRAMOS */
    .tramos-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f8faf8;
      border: 1.5px solid #d0ddd0;
      border-radius: 10px;
    }
    .tramos-label { font-size: 15px; color: #1a2e1a; font-weight: 500; }
    .tramos-controls { display: flex; align-items: center; gap: 10px; }
    .tramos-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: #0d5c3a;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .tramos-btn:active { transform: scale(0.92); }
    .tramos-btn:hover { background: #0a4a2e; }
    .tramos-count { font-size: 22px; font-weight: 800; color: #0d5c3a; min-width: 28px; text-align: center; }

    /* PALISTAS */
    .palistas-list { display: flex; flex-direction: column; gap: 10px; }
    .palista-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .palista-name-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d0ddd0;
      border-radius: 10px;
      font-size: 15px;
      color: #1a2e1a;
      background: #f8faf8;
      transition: border-color 0.2s;
    }
    .palista-name-input:focus {
      outline: none;
      border-color: #0d5c3a;
      box-shadow: 0 0 0 3px rgba(13,92,58,0.12);
      background: white;
    }
    .palista-cat-select {
      width: 80px;
      padding: 10px 8px;
      border: 1.5px solid #d0ddd0;
      border-radius: 10px;
      font-size: 14px;
      color: #1a2e1a;
      background: #f8faf8;
      -webkit-appearance: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    .palista-cat-select:focus {
      outline: none;
      border-color: #0d5c3a;
      box-shadow: 0 0 0 3px rgba(13,92,58,0.12);
      background: white;
    }
    .palista-remove-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: none;
      background: #fee2e2;
      color: #dc2626;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .palista-remove-btn:hover { background: #fecaca; }

    .add-palista-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border: 2px dashed #b0cdb0;
      border-radius: 10px;
      background: transparent;
      color: #0d5c3a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: border-color 0.2s, background 0.2s;
    }
    .add-palista-btn:hover { border-color: #0d5c3a; background: #f0f8f0; }

    /* TRAMOS COUNT DISPLAY */
    .tramos-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .tramos-count-display {
      background: #f0f8f0;
      border: 1.5px solid #d0ddd0;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* START BTN */
    .start-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a3a2a 0%, #0d5c3a 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(13,92,58,0.3);
    }
    .start-btn:active { transform: scale(0.98); opacity: 0.9; }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="window.location.href='menu.html'">&#8592;</button>
    <h1>Nueva Sesión</h1>
  </div>
  <div class="topbar-right"></div>
</div>

<div class="main">

  <!-- LUGAR -->
  <div class="section-card">
    <div class="section-title">📍 Lugar</div>
    <div class="field">
      <input type="text" id="lugar" placeholder="Nombre del lugar o río" autocomplete="off">
    </div>
  </div>

  <!-- TRAMOS -->
  <div class="section-card">
    <div class="section-title">🚩 Número de tramos</div>
    <div class="tramos-count-display">
      <span class="tramos-label">Tramos por palista</span>
      <div class="tramos-controls">
        <button class="tramos-btn" onclick="changeTramos(-1)">−</button>
        <span class="tramos-count" id="tramos-count">10</span>
        <button class="tramos-btn" onclick="changeTramos(1)">+</button>
      </div>
    </div>
  </div>

  <!-- PALISTAS -->
  <div class="section-card">
    <div class="section-title">🏄 Palistas</div>
    <div class="palistas-list" id="palistas-list"></div>
    <button class="add-palista-btn" id="add-palista-btn" onclick="addPalista()">+ Añadir palista</button>
    <p class="error-msg" id="palistas-error">Por favor, añade al menos un palista.</p>
  </div>

  <!-- START -->
  <button class="start-btn" id="start-btn" onclick="startSession()">🏁 Iniciar Sesión</button>

</div>

<script>
const SUPA_URL = 'https://bazprdygkbhvdlzsmhxh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhenByZHlna2JodmRsenNtaHhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY4MDMwNzgsImV4cCI6MjA2MjM3OTA3OH0.8ARKHgGvWFfFSAhf_bG3qRYh1YDy9kkUXGNXvxXt3_Q';

let tramosCount = 10;

function changeTramos(delta) {
  tramosCount = Math.max(1, Math.min(50, tramosCount + delta));
  document.getElementById('tramos-count').textContent = tramosCount;
}

function addPalista(nombre = '', categoria = 'K1') {
  const list = document.getElementById('palistas-list');
  const row = document.createElement('div');
  row.className = 'palista-row';
  row.innerHTML = `
    <input type="text" class="palista-name-input" placeholder="Nombre del palista" value="${nombre}" autocomplete="off">
    <select class="palista-cat-select">
      <option value="K1" ${categoria === 'K1' ? 'selected' : ''}>K1</option>
      <option value="C1" ${categoria === 'C1' ? 'selected' : ''}>C1</option>
      <option value="C2" ${categoria === 'C2' ? 'selected' : ''}>C2</option>
    </select>
    <button class="palista-remove-btn" onclick="this.closest('.palista-row').remove()">×</button>
  `;
  list.appendChild(row);
}

function getPalistas() {
  const rows = document.querySelectorAll('.palista-row');
  return Array.from(rows).map(row => ({
    nombre: row.querySelector('.palista-name-input').value.trim(),
    categoria: row.querySelector('.palista-cat-select').value
  })).filter(p => p.nombre);
}

async function startSession() {
  const lugar = document.getElementById('lugar').value.trim();
  const palistas = getPalistas();
  const errEl = document.getElementById('palistas-error');

  if (palistas.length === 0) {
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Creando sesión...';

  const tok = localStorage.getItem('sb_access_token');
  const user = JSON.parse(localStorage.getItem('sb_user') || '{}');
  if (!tok || !user.id) {
    alert('Sesión expirada. Por favor, inicia sesión de nuevo.');
    window.location.href = 'index.html';
    return;
  }

  const sessionData = {
    user_id: user.id,
    status: 'active',
    lugar: lugar || null,
    num_tramos: tramosCount,
    palistas: palistas,
    created_at: new Date().toISOString()
  };

  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/slalom_sessions`, {
      method: 'POST',
      headers: {
        apikey: SUPA_KEY,
        Authorization: `Bearer ${tok}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify(sessionData)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || `HTTP ${res.status}`);
    }

    const [session] = await res.json();
    window.location.href = `slalom-session.html?id=${session.id}`;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '🏁 Iniciar Sesión';
    alert('Error al crear la sesión: ' + e.message);
  }
}

// Init: add one empty palista row
addPalista();
</script>

</body>
</html>
