<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLTimer">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
<title>SLTimer — Palistas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* ── Topbar ── */
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-back{background:none;border:none;cursor:pointer;font-size:20px;color:#666;padding:0 4px;line-height:1;display:flex;align-items:center}
.topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-brand img{width:28px;height:28px;border-radius:7px;display:block}
.topbar-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1B3A5C;letter-spacing:0.5px;line-height:1}
.topbar-divider{width:0.5px;height:18px;background:rgba(0,0,0,0.12);flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:#111;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-new{background:#185FA5;border:none;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;flex-shrink:0;transition:opacity .12s}
.btn-new:active{opacity:.8}
.btn-new svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Search bar ── */
.search-wrap{padding:12px 16px 0;max-width:480px;margin:0 auto}
.search-box{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;display:flex;align-items:center;gap:8px;padding:10px 14px}
.search-box svg{width:16px;height:16px;fill:none;stroke:#aaa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.search-input{border:none;outline:none;font-size:15px;color:#111;background:transparent;font-family:inherit;width:100%;-webkit-appearance:none}
.search-input::placeholder{color:#bbb}
.search-clear{background:none;border:none;cursor:pointer;font-size:18px;color:#bbb;padding:0;line-height:1;display:none;flex-shrink:0}
.search-clear.show{display:block}

/* ── Filter tabs ── */
.filter-wrap{padding:10px 16px 0;max-width:480px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filter-wrap::-webkit-scrollbar{display:none}
.filter-btn{border:0.5px solid #ddd;background:#fff;font-size:12px;font-weight:600;color:#888;padding:6px 14px;border-radius:100px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:all .12s}
.filter-btn.active{background:#185FA5;border-color:#185FA5;color:#fff}
.filter-btn:active{opacity:.75}

/* ── Content ── */
.content{padding:12px 16px 40px;display:flex;flex-direction:column;gap:8px;max-width:480px;margin:0 auto}

/* ── Stats bar ── */
.stats-bar{display:flex;gap:8px;padding-top:4px}
.stat-chip{flex:1;background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:12px;padding:10px 12px;text-align:center}
.stat-num{font-size:20px;font-weight:700;color:#1B3A5C;line-height:1;margin-bottom:2px}
.stat-label{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:0.05em}

/* ── Section label ── */
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:4px 2px 2px}

/* ── Athlete card ── */
.athlete-list{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;overflow:hidden}
.athlete-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:background .1s;-webkit-tap-highlight-color:transparent}
.athlete-item+.athlete-item{border-top:0.5px solid #f2f2f2}
.athlete-item:active{background:#f7f7f7}
.ath-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;letter-spacing:-0.5px}
.ath-avatar.k1{background:#E6F1FB;color:#0C447C;border:0.5px solid #B5D4F4}
.ath-avatar.c1{background:#E1F5EE;color:#085041;border:0.5px solid #A3DEC8}
.ath-avatar.kxc{background:#FAEEDA;color:#633806;border:0.5px solid #F3CA8A}
.ath-avatar.shared{background:#f0f0f0;color:#555;border:0.5px solid #e0e0e0}
.ath-info{flex:1;min-width:0}
.ath-name{font-size:15px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ath-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.ath-cats{display:flex;gap:4px}
.cat-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;letter-spacing:0.03em}
.cat-badge.K1{background:#E6F1FB;color:#0C447C}
.cat-badge.C1{background:#E1F5EE;color:#085041}
.cat-badge.KXC{background:#FAEEDA;color:#633806}
.ath-age{font-size:12px;color:#bbb}
.ath-sex{font-size:11px;color:#bbb}
.ath-shared-badge{font-size:10px;font-weight:700;background:#f0f0f0;color:#888;padding:2px 7px;border-radius:100px}
.ath-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.btn-share-ath{background:none;border:0.5px solid #ddd;border-radius:8px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;color:#666;flex-shrink:0;transition:background .1s}
.btn-share-ath:active{background:#f0f0f0}
.btn-share-ath svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:12px;text-align:center}
.empty-icon{width:56px;height:56px;background:#E6F1FB;border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:28px;height:28px;fill:none;stroke:#0C447C;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:16px;font-weight:700;color:#111}
.empty-sub{font-size:13px;color:#aaa;line-height:1.5}
.empty-btn{background:#185FA5;border:none;color:#fff;font-size:14px;font-weight:700;padding:12px 24px;border-radius:12px;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .12s}
.empty-btn:active{opacity:.8}
.no-results{padding:32px 16px;text-align:center}
.no-results p{font-size:14px;color:#aaa}

/* ── Loading overlay ── */
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}

/* ── Skeleton ── */
.skeleton-item{display:flex;align-items:center;gap:12px;padding:12px 16px}
.skeleton-item+.skeleton-item{border-top:0.5px solid #f2f2f2}
.sk{background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:100px}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0}
.sk-info{flex:1;display:flex;flex-direction:column;gap:6px}
.sk-line{height:13px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#A32D2D}
.toast.ok{background:#0F6E56}

/* FAB */
.fab{position:fixed;bottom:28px;right:20px;width:52px;height:52px;border-radius:50%;background:#185FA5;border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(24,95,165,0.38);z-index:50;transition:transform .12s,opacity .12s;-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.93);opacity:.9}

/* ── Modal compartir ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:17px;font-weight:700;color:#111;margin-bottom:4px}
.modal-sub{font-size:13px;color:#888;margin-bottom:18px;line-height:1.4}
.share-input-wrap{position:relative}
.share-input{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:#111;outline:none;transition:border-color .15s;-webkit-appearance:none}
.share-input:focus{border-color:#185FA5}
.share-input.found{border-color:#0F6E56}
.share-input.notfound{border-color:#C0392B}
.share-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.10);z-index:10;overflow:hidden;display:none}
.share-suggestions.show{display:block}
.suggestion-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.suggestion-item:hover,.suggestion-item:active{background:#f5f9ff}
.suggestion-item+.suggestion-item{border-top:0.5px solid #f2f2f2}
.sug-avatar{width:34px;height:34px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sug-name{font-size:14px;font-weight:600;color:#111;line-height:1.2}
.sug-username{font-size:12px;color:#888}
.share-found-info{margin-top:10px;padding:10px 14px;background:#F0FBF5;border-radius:10px;display:none;align-items:center;gap:10px}
.share-found-info.show{display:flex}
.share-found-avatar{width:36px;height:36px;border-radius:50%;background:#0F6E56;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.share-found-name{font-size:14px;font-weight:600;color:#111}
.share-found-sub{font-size:12px;color:#0F6E56}
.share-can-share{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;background:#f9f9f9;border-radius:12px}
.share-can-share label{font-size:13px;color:#555;flex:1;cursor:pointer}
.share-can-share input[type=checkbox]{width:18px;height:18px;accent-color:#185FA5;cursor:pointer}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-modal-cancel{flex:1;background:#f0f0f0;border:none;color:#555;font-size:15px;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit}
.btn-modal-cancel:active{background:#e4e4e4}
.btn-modal-send{flex:2;background:#185FA5;border:none;color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;transition:opacity .12s}
.btn-modal-send:disabled{opacity:.45;cursor:not-allowed}
.btn-modal-send:not(:disabled):active{opacity:.85}
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Cargando...</p></div>

<!-- TOPBAR -->
<div class="topbar">
  <button class="topbar-back" onclick="goBack()">&#8592;</button>
  <div class="topbar-brand">
    <img src="icons/icon-192x192.png" alt="SLTimer">
    <span class="topbar-brand-name">SLTimer</span>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Mis palistas</span>
  <div class="topbar-actions">
    <button class="btn-new" onclick="goNew()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo
    </button>
  </div>
</div>

<!-- BÚSQUEDA -->
<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input class="search-input" id="search-input" type="text" placeholder="Buscar palista…" oninput="onSearch()" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- FILTROS -->
<div class="filter-wrap" id="filter-wrap">
  <button class="filter-btn active" data-filter="all"    onclick="setFilter(this,'all')">Todos</button>
  <button class="filter-btn"        data-filter="own"    onclick="setFilter(this,'own')">Mis palistas</button>
  <button class="filter-btn"        data-filter="shared" onclick="setFilter(this,'shared')">Compartidos</button>
  <button class="filter-btn"        data-filter="K1"     onclick="setFilter(this,'K1')">K1</button>
  <button class="filter-btn"        data-filter="C1"     onclick="setFilter(this,'C1')">C1</button>
  <button class="filter-btn"        data-filter="KXC"    onclick="setFilter(this,'KXC')">KXC</button>
</div>

<!-- CONTENIDO -->
<div class="content" id="content">
  <div id="skeleton-wrap">
    <div class="stats-bar">
      <div class="stat-chip"><div class="sk sk-line" style="width:32px;height:20px;margin:0 auto 4px"></div><div class="sk sk-line" style="width:50px;height:10px;margin:0 auto"></div></div>
      <div class="stat-chip"><div class="sk sk-line" style="width:32px;height:20px;margin:0 auto 4px"></div><div class="sk sk-line" style="width:50px;height:10px;margin:0 auto"></div></div>
      <div class="stat-chip"><div class="sk sk-line" style="width:32px;height:20px;margin:0 auto 4px"></div><div class="sk sk-line" style="width:50px;height:10px;margin:0 auto"></div></div>
    </div>
    <div class="athlete-list" style="margin-top:8px">
      <div class="skeleton-item"><div class="sk sk-avatar"></div><div class="sk-info"><div class="sk sk-line" style="width:55%;height:14px"></div><div class="sk sk-line" style="width:35%;height:11px"></div></div></div>
      <div class="skeleton-item"><div class="sk sk-avatar"></div><div class="sk-info"><div class="sk sk-line" style="width:55%;height:14px"></div><div class="sk sk-line" style="width:35%;height:11px"></div></div></div>
      <div class="skeleton-item"><div class="sk sk-avatar"></div><div class="sk-info"><div class="sk sk-line" style="width:55%;height:14px"></div><div class="sk sk-line" style="width:35%;height:11px"></div></div></div>
    </div>
  </div>
  <div id="main-content" style="display:none"></div>
</div>

<button class="fab" id="fab" onclick="goNew()" title="Nuevo palista" style="display:none">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="toast" id="toast"></div>

<!-- MODAL COMPARTIR PALISTA -->
<div class="modal-bg" id="share-modal" onclick="handleModalBgClick(event)">
  <div class="modal-sheet" id="share-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="share-modal-title">Compartir palista</div>
    <div class="modal-sub">Introduce el email o @usuario del entrenador con quien quieres compartir</div>

    <div class="share-input-wrap">
      <input class="share-input" id="share-input"
        type="text"
        placeholder="email@ejemplo.com o @usuario"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        oninput="onShareInput()"
      >
      <div class="share-suggestions" id="share-suggestions"></div>
    </div>

    <div class="share-found-info" id="share-found-info">
      <div class="share-found-avatar" id="share-found-avatar"></div>
      <div>
        <div class="share-found-name" id="share-found-name"></div>
        <div class="share-found-sub" id="share-found-sub"></div>
      </div>
    </div>

    <div class="share-can-share">
      <label for="share-can-share-chk">Permitir que también pueda compartir este palista</label>
      <input type="checkbox" id="share-can-share-chk" checked>
    </div>

    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeShareModal()">Cancelar</button>
      <button class="btn-modal-send" id="share-send-btn" disabled onclick="sendShareInvite()">
        Enviar invitación
      </button>
    </div>
  </div>
</div>

<script>
const SB  = 'https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';
let _tok=null,_uid=null,_email=null,_allAthletes=[],_filter='all',_query='';
const $=id=>document.getElementById(id);

// ── Share modal state ──
let _shareAthleteId=null,_shareAthleteName='';
let _foundCoach=null;
let _searchTimer=null;

let _tTimer;
function toast(msg,type=''){const el=$('toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');el.classList.add('show');clearTimeout(_tTimer);_tTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function initials(name,surname){const a=name?.trim()[0]||'';const b=surname?.trim()[0]||name?.trim()[1]||'';return(a+b).toUpperCase()||'?';}
function calcAge(birth_date){if(!birth_date)return null;const dob=new Date(birth_date);const diff=Date.now()-dob.getTime();return Math.floor(diff/(1000*60*60*24*365.25));}
function avatarClass(a){if(a._shared)return'shared';if(!a.categories||a.categories.length===0)return'shared';if(a.categories.includes('K1'))return'k1';if(a.categories.includes('C1'))return'c1';if(a.categories.includes('KXC'))return'kxc';return'shared';}
function sexLabel(s){if(s==='M')return'♂';if(s==='F')return'♀';if(s==='O')return'⚥';return'';}

async function api(path,opts={}){const h={'apikey':KEY,'Content-Type':'application/json','Authorization':'Bearer '+_tok,...(opts.headers||{})};const r=await fetch(SB+path,{...opts,headers:h});const t=await r.text();let j;try{j=JSON.parse(t);}catch{j=t;}if(!r.ok)throw new Error(j?.message||j?.hint||JSON.stringify(j));return j;}

function applyFilters(){let list=_allAthletes;if(_filter==='own')list=list.filter(a=>!a._shared);if(_filter==='shared')list=list.filter(a=>a._shared);if(['K1','C1','KXC'].includes(_filter))list=list.filter(a=>a.categories&&a.categories.includes(_filter));if(_query){const q=_query.toLowerCase();list=list.filter(a=>((a.name||'')+' '+(a.surname||'')).toLowerCase().includes(q));}return list;}

function render(){
  const list=applyFilters();
  const owned=_allAthletes.filter(a=>!a._shared).length;
  const shared=_allAthletes.filter(a=>a._shared).length;
  const wrap=$('main-content');
  const statsHTML=`<div class="stats-bar"><div class="stat-chip"><div class="stat-num">${_allAthletes.length}</div><div class="stat-label">Total</div></div><div class="stat-chip"><div class="stat-num">${owned}</div><div class="stat-label">Propios</div></div><div class="stat-chip"><div class="stat-num">${shared}</div><div class="stat-label">Compartidos</div></div></div>`;
  if(_allAthletes.length===0){wrap.innerHTML=`<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg></div><div class="empty-title">Sin palistas aún</div><div class="empty-sub">Añade tus primeros palistas para empezar a gestionar sesiones y tiempos</div><button class="empty-btn" onclick="goNew()">+ Añadir palista</button></div>`;return;}
  if(list.length===0){wrap.innerHTML=statsHTML+`<div class="no-results"><p>No se encontraron palistas con ese criterio</p></div>`;return;}
  let ownList=list.filter(a=>!a._shared);
  let sharedList=list.filter(a=>a._shared);
  let html=statsHTML;

  function renderGroup(athletes,label){
    if(athletes.length===0)return'';
    const isOwn=label==='Mis palistas';
    const items=athletes.map(a=>{
      const ini=initials(a.name,a.surname);
      const avCls=avatarClass(a);
      const age=calcAge(a.birth_date);
      const sx=sexLabel(a.sex);
      const cats=(a.categories||[]).map(c=>`<span class="cat-badge ${c}">${c}</span>`).join('');
      const meta=[cats?`<span class="ath-cats">${cats}</span>`:'',age?`<span class="ath-age">${age} años</span>`:'',sx?`<span class="ath-sex">${sx}</span>`:'',a._shared?`<span class="ath-shared-badge">Compartido</span>`:''].filter(Boolean).join('');
      const fullName=a.name+(a.surname?' '+a.surname:'');
      const shareBtn=isOwn
        ?`<button class="btn-share-ath" title="Compartir" onclick="openShareModal(event,'${a.id}','${fullName.replace(/'/g,"\\'")}')"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>`
        :'';
      return`<div class="athlete-item" style="gap:10px">
        <div class="ath-avatar ${avCls}" style="cursor:pointer" onclick="goEdit('${a.id}')">${ini}</div>
        <div class="ath-info" style="cursor:pointer" onclick="goEdit('${a.id}')">
          <div class="ath-name">${fullName}</div>
          <div class="ath-meta">${meta}</div>
        </div>
        ${shareBtn}
        <span class="ath-arrow" style="cursor:pointer" onclick="goEdit('${a.id}')">›</span>
      </div>`;
    }).join('');
    return`<div class="section-label">${label}</div><div class="athlete-list">${items}</div>`;
  }

  if(_filter==='all'){html+=renderGroup(ownList,'Mis palistas');html+=renderGroup(sharedList,'Compartidos conmigo');}else{html+=renderGroup(list,_filter==='shared'?'Compartidos conmigo':'Palistas');}
  wrap.innerHTML=html;
}

function onSearch(){_query=$('search-input').value.trim();$('search-clear').classList.toggle('show',_query.length>0);render();}
function clearSearch(){$('search-input').value='';_query='';$('search-clear').classList.remove('show');render();}
function setFilter(btn,val){_filter=val;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

async function loadAthletes(){
  try{
    const owned=await api(`/rest/v1/athletes?owner_id=eq.${_uid}&select=*&order=name.asc`);
    let sharedIds=[];
    try{const access=await api(`/rest/v1/athlete_access?trainer_id=eq.${_uid}&select=athlete_id`);sharedIds=(access||[]).map(a=>a.athlete_id);}catch{}
    let sharedAthletes=[];
    if(sharedIds.length>0){
      const notOwned=sharedIds.filter(id=>!(owned||[]).find(a=>a.id===id));
      if(notOwned.length>0){
        const ids=notOwned.join(',');
        sharedAthletes=await api(`/rest/v1/athletes?id=in.(${ids})&select=*&order=name.asc`);
        sharedAthletes=(sharedAthletes||[]).map(a=>({...a,_shared:true}));
      }
    }
    _allAthletes=[...(owned||[]),...sharedAthletes];
    $('skeleton-wrap').style.display='none';
    $('main-content').style.display='';
    $('fab').style.display='flex';
    render();
  }catch(e){
    $('skeleton-wrap').style.display='none';
    $('main-content').style.display='';
    $('main-content').innerHTML=`<div class="no-results"><p>Error al cargar: ${e.message}</p></div>`;
    toast(e.message,'err');
  }
}

// ── Share modal ──
function openShareModal(evt,athleteId,athleteName){
  evt.stopPropagation();
  _shareAthleteId=athleteId;
  _shareAthleteName=athleteName;
  _foundCoach=null;
  $('share-modal-title').textContent='Compartir: '+athleteName;
  $('share-input').value='';
  $('share-input').className='share-input';
  $('share-suggestions').innerHTML='';
  $('share-suggestions').classList.remove('show');
  $('share-found-info').classList.remove('show');
  $('share-send-btn').disabled=true;
  $('share-can-share-chk').checked=true;
  $('share-modal').classList.add('show');
  setTimeout(()=>$('share-input').focus(),200);
}

function closeShareModal(){
  $('share-modal').classList.remove('show');
  clearTimeout(_searchTimer);
}

function handleModalBgClick(evt){
  if(evt.target===$('share-modal'))closeShareModal();
}

function coachInitials(name){
  if(!name)return'?';
  const parts=name.trim().split(' ');
  if(parts.length>=2)return(parts[0][0]+parts[1][0]).toUpperCase();
  return name.trim().substring(0,2).toUpperCase();
}

async function onShareInput(){
  const val=$('share-input').value.trim();
  _foundCoach=null;
  $('share-send-btn').disabled=true;
  $('share-input').className='share-input';
  $('share-found-info').classList.remove('show');
  $('share-suggestions').classList.remove('show');
  $('share-suggestions').innerHTML='';
  clearTimeout(_searchTimer);
  if(val.length<2)return;

  _searchTimer=setTimeout(async()=>{
    try{
      const res=await api('/rest/v1/rpc/search_coach',{method:'POST',body:JSON.stringify({query:val})});
      const coaches=res||[];

      if(val.startsWith('@')){
        if(coaches.length>0){
          const html=coaches.map(c=>{
            const ini=coachInitials(c.display_name);
            return`<button class="suggestion-item" onclick="selectCoach(${JSON.stringify(c).replace(/"/g,'&quot;')})">
              <div class="sug-avatar">${ini}</div>
              <div><div class="sug-name">${c.display_name||'Sin nombre'}</div><div class="sug-username">@${c.username}</div></div>
            </button>`;
          }).join('');
          $('share-suggestions').innerHTML=html;
          $('share-suggestions').classList.add('show');
        } else {
          $('share-suggestions').innerHTML=`<div style="padding:12px 14px;font-size:13px;color:#aaa">No se encontró ningún entrenador con ese usuario</div>`;
          $('share-suggestions').classList.add('show');
          $('share-input').className='share-input notfound';
        }
      } else {
        const isValidEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if(!isValidEmail)return;
        if(coaches.length>0){
          selectCoach(coaches[0]);
        } else {
          _foundCoach={user_id:null,display_name:val,username:null,found_by:'email_pending',email:val};
          $('share-input').className='share-input found';
          $('share-found-avatar').textContent='✉';
          $('share-found-name').textContent=val;
          $('share-found-sub').textContent='Se enviará una invitación a este email';
          $('share-found-info').classList.add('show');
          $('share-send-btn').disabled=false;
        }
      }
    }catch(e){
      console.error(e);
    }
  },350);
}

function selectCoach(coach){
  _foundCoach=coach;
  $('share-suggestions').classList.remove('show');
  const displayVal=coach.username?('@'+coach.username):coach.display_name;
  $('share-input').value=displayVal;
  $('share-input').className='share-input found';
  $('share-found-avatar').textContent=coachInitials(coach.display_name);
  $('share-found-name').textContent=coach.display_name||displayVal;
  $('share-found-sub').textContent=coach.username?('@'+coach.username+' · Entrenador registrado'):'Entrenador registrado';
  $('share-found-info').classList.add('show');
  $('share-send-btn').disabled=false;
}

async function sendShareInvite(){
  if(!_foundCoach||!_shareAthleteId)return;
  const canShare=$('share-can-share-chk').checked;
  const btn=$('share-send-btn');
  btn.disabled=true;
  btn.textContent='Enviando…';

  try{
    const isPending=_foundCoach.found_by==='email_pending';

    if(!isPending && _foundCoach.user_id){
      await api('/rest/v1/athlete_access',{
        method:'POST',
        headers:{'Prefer':'return=minimal'},
        body:JSON.stringify({
          athlete_id:_shareAthleteId,
          trainer_id:_foundCoach.user_id,
          granted_by:_uid,
          can_share:canShare
        })
      });
      const invBody={athlete_id:_shareAthleteId,invited_by:_uid,can_share:canShare,status:'accepted'};
      if(_foundCoach.username)invBody.to_username=_foundCoach.username;
      else invBody.to_email=_foundCoach.display_name;
      try{await api('/rest/v1/athlete_share_invites',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(invBody)});}catch{}
      toast('Acceso concedido a '+(_foundCoach.display_name||'el entrenador'),'ok');
    } else {
      await api('/rest/v1/athlete_share_invites',{
        method:'POST',
        headers:{'Prefer':'return=minimal'},
        body:JSON.stringify({
          athlete_id:_shareAthleteId,
          invited_by:_uid,
          to_email:_foundCoach.email,
          can_share:canShare
        })
      });
      toast('Invitación enviada a '+_foundCoach.email,'ok');
    }
    closeShareModal();
  }catch(e){
    toast('Error: '+e.message,'err');
    btn.disabled=false;
    btn.textContent='Enviar invitación';
  }
}

function goBack(){window.location.href='menu.html';}
function goNew(){window.location.href='athlete.html';}
