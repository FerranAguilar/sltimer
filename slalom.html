<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLTimer &#8212; Eslálom</title>
  <script>
    // Redirigir a la nueva página de configuración
    // Si hay una sesión en curso (slalom_resume), ir directamente a la sesión
    if (sessionStorage.getItem('slalom_resume')) {
      window.location.replace('slalom-session.html');
    } else {
      window.location.replace('slalom-config.html');
    }
  </script>
</head>
<body></body>
</html>
