<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f0; min-height: 100vh; color: #1a2e1a; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: linear-gradient(135deg, #1a3a2a 0%, #0d5c3a 100%); color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { background: rgba(255,255,255,0.15); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .section-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section-title { font-size: 13px; font-weight: 700; color: #0d5c3a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 10px 14px; border: 1.5px solid #d0ddd0; border-radius: 10px; font-size: 15px; color: #1a2e1a; background: #f8faf8; transition: border-color 0.2s; -webkit-appearance: none; }
    .field input:focus, .field select:focus { outline: none; border-color: #0d5c3a; box-shadow: 0 0 0 3px rgba(13,92,58,0.12); background: white; }
    .save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a3a2a 0%, #0d5c3a 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 15px rgba(13,92,58,0.3); }
    .logout-btn { width: 100%; padding: 14px; background: #fee2e2; color: #dc2626; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .user-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #1a3a2a, #0d5c3a); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px; }
    .user-name { text-align: center; font-size: 18px; font-weight: 700; color: #1a2e1a; }
    .user-email { text-align: center; font-size: 14px; color: #666; margin-top: 4px; }
    .version-text { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="window.location.href='menu.html'">&#8592;</button>
    <h1>Ajustes</h1>
  </div>
</div>
<div class="main">
  <div class="section-card">
    <div class="user-avatar">🧑‍🏫</div>
    <div class="user-name" id="user-name">-</div>
    <div class="user-email" id="user-email">-</div>
  </div>
  <div class="section-card">
    <div class="section-title">🔔 Notificaciones</div>
    <div class="field">
      <label>Notificaciones push</label>
      <select id="notif-pref">
        <option value="all">Todas</option>
        <option value="important">Solo importantes</option>
        <option value="none">Ninguna</option>
      </select>
    </div>
  </div>
  <div class="section-card">
    <div class="section-title">ℹ️ Información</div>
    <div class="version-text">SLTimer v1.0.0 &mdash; Cronometrador de slalom</div>
  </div>
  <button class="logout-btn" onclick="logout()">🚪 Cerrar sesión</button>
</div>
<script>
  const u = JSON.parse(localStorage.getItem('sb_user') || '{}');
  document.getElementById('user-name').textContent = u.name || u.email || 'Usuario';
  document.getElementById('user-email').textContent = u.email || '';
  function logout() {
    localStorage.removeItem('sb_access_token');
    localStorage.removeItem('sb_refresh_token');
    localStorage.removeItem('sb_user');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
