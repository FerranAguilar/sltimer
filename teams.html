<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLTimer">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
<title>SLTimer — Grupos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f4;min-height:100vh;-webkit-tap-highlight-color:transparent}
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none}
.topbar-brand img{width:28px;height:28px;border-radius:7px;display:block}
.topbar-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1B3A5C;letter-spacing:0.5px;line-height:1}
.topbar-divider{width:0.5px;height:18px;background:rgba(0,0,0,0.12);flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:#111;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-new{background:#185FA5;border:none;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn-new:active{opacity:.8}
.btn-new svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.content{padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px;max-width:480px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;padding:4px 2px 2px}
.group-card{background:#fff;border:0.5px solid rgba(0,0,0,0.10);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;border:none;width:100%;text-align:left;font-family:inherit;border:0.5px solid rgba(0,0,0,0.10)}
.group-card:active{background:#f7f9fc}
.group-icon{width:46px;height:46px;border-radius:12px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.group-icon svg{width:22px;height:22px;fill:none;stroke:#0C447C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.group-icon.owner{background:#E6F1FB} .group-icon.owner svg{stroke:#0C447C}
.group-icon.member{background:#E1F5EE} .group-icon.member svg{stroke:#085041}
.group-info{flex:1;min-width:0}
.group-name{font-size:15px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-meta{font-size:12px;color:#aaa;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group-role{font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px}
.group-role.owner{background:#E6F1FB;color:#0C447C}
.group-role.member{background:#E1F5EE;color:#085041}
.group-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 24px;gap:14px;text-align:center}
.empty-icon{width:60px;height:60px;background:#E6F1FB;border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:28px;height:28px;fill:none;stroke:#0C447C;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:16px;font-weight:700;color:#111}
.empty-sub{font-size:13px;color:#aaa;line-height:1.5;max-width:280px}
.empty-btn{background:#185FA5;border:none;color:#fff;font-size:14px;font-weight:700;padding:12px 28px;border-radius:12px;cursor:pointer;font-family:inherit;margin-top:4px}
.empty-btn:active{opacity:.8}
/* Sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.40);z-index:200;display:none;opacity:0;transition:opacity .22s}
.sheet-backdrop.open{display:block;opacity:1}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:201;padding:0 16px 36px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1,.6,1);max-width:480px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:12px auto 20px}
.sheet-title{font-size:17px;font-weight:700;color:#1B3A5C;margin-bottom:16px}
label{font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff;color:#111;font-family:inherit;-webkit-appearance:none;resize:none}
input:focus,textarea:focus{outline:none;border-color:#185FA5}
.ig{margin-bottom:12px}
.btn-primary{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:#185FA5;color:#fff;font-family:inherit;margin-top:4px}
.btn-primary:active{opacity:.85}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
/* Invites badge */
.invite-banner{background:#FEF3C7;border:0.5px solid #FDE68A;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.invite-banner svg{width:20px;height:20px;fill:none;stroke:#92400E;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.invite-banner-text{flex:1}
.invite-banner-title{font-size:14px;font-weight:700;color:#92400E}
.invite-banner-sub{font-size:12px;color:#B45309;margin-top:1px}
.invite-banner-arrow{color:#D97706;font-size:18px}
/* Loading */
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:22px;height:22px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:#666}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B3A5C;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.ok{background:#0F6E56}
.toast.err{background:#A32D2D}
.sk{background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-msg">Cargando...</p></div>
<div class="toast" id="toast"></div>

<!-- SHEET: Nuevo grupo -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet-new">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Nuevo grupo de trabajo</div>
  <div class="ig"><label>Nombre del grupo</label><input id="new-name" type="text" placeholder="Ej: Equipo Sevilla Slalom"></div>
  <div class="ig"><label>Descripción (opcional)</label><textarea id="new-desc" rows="2" placeholder="Ej: Grupo de entrenadores del canal olímpico"></textarea></div>
  <button class="btn-primary" id="btn-create" onclick="createTeam()">Crear grupo</button>
</div>

<div class="topbar">
  <a class="topbar-brand" href="menu.html">
    <img src="icons/icon-192x192.png" alt="SLTimer">
    <span class="topbar-brand-name">SLTimer</span>
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Grupos</span>
  <div class="topbar-actions">
    <button class="btn-new" onclick="openSheet()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo
    </button>
  </div>
</div>

<div class="content" id="content">
  <!-- Skeleton -->
  <div id="skeleton">
    <div style="background:#fff;border-radius:14px;border:0.5px solid rgba(0,0,0,0.10);padding:16px;display:flex;gap:14px;align-items:center">
      <div class="sk" style="width:46px;height:46px;border-radius:12px;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:7px">
        <div class="sk" style="height:14px;width:60%"></div>
        <div class="sk" style="height:11px;width:40%"></div>
      </div>
    </div>
    <div style="background:#fff;border-radius:14px;border:0.5px solid rgba(0,0,0,0.10);padding:16px;display:flex;gap:14px;align-items:center">
      <div class="sk" style="width:46px;height:46px;border-radius:12px;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:7px">
        <div class="sk" style="height:14px;width:50%"></div>
        <div class="sk" style="height:11px;width:35%"></div>
      </div>
    </div>
  </div>
  <div id="main-content" style="display:none"></div>
</div>

<script>
const SB  = 'https://duwmhatcqxlwtqdnzhle.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1d21oYXRjcXhsd3RxZG56aGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIwMDMsImV4cCI6MjA5MzMwODAwM30.CkvnBvuo8rS2cv1Uts6dmUATUMbW9Dgjg4L29HE9Wdo';
let _tok=null, _uid=null;
const $=id=>document.getElementById(id);

let _tTimer;
function toast(msg,type=''){const el=$('toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');el.classList.add('show');clearTimeout(_tTimer);_tTimer=setTimeout(()=>el.classList.remove('show'),3000);}

async function api(path,opts={}){const h={'apikey':KEY,'Content-Type':'application/json','Authorization':'Bearer '+_tok,...(opts.headers||{})};const r=await fetch(SB+path,{...opts,headers:h});const t=await r.text();let j;try{j=JSON.parse(t);}catch{j=t;}if(!r.ok)throw new Error(j?.message||JSON.stringify(j));return j;}

function openSheet(){$('new-name').value='';$('new-desc').value='';$('sheet-backdrop').classList.add('open');setTimeout(()=>$('sheet-new').classList.add('open'),10);setTimeout(()=>$('new-name').focus(),300);}
function closeSheet(){$('sheet-new').classList.remove('open');$('sheet-backdrop').classList.remove('open');}

async function createTeam(){
  const name=$('new-name').value.trim();
  if(!name){toast('Introduce un nombre para el grupo','err');return;}
  const desc=$('new-desc').value.trim();
  const btn=$('btn-create');btn.disabled=true;btn.textContent='Creando...';
  try{
    const row=await api('/rest/v1/teams?select=id',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({name,description:desc||null,owner_id:_uid})});
    const teamId=Array.isArray(row)?row[0].id:row.id;
    // Insertar al creador como miembro owner
    await api('/rest/v1/team_members',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({team_id:teamId,user_id:_uid,role:'owner'})});
    closeSheet();
    toast('Grupo creado ✓','ok');
    await loadTeams();
  }catch(e){
    toast('Error: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='Crear grupo';
  }
}

async function loadTeams(){
  try{
    // Grupos propios
    const owned = await api('/rest/v1/teams?owner_id=eq.'+_uid+'&select=id,name,description,created_at&order=created_at.desc');
    // Grupos donde soy miembro (no propietario)
    const memberRows = await api('/rest/v1/team_members?user_id=eq.'+_uid+'&role=eq.member&select=team_id');
    const memberIds = (memberRows||[]).map(r=>r.team_id);
    let memberTeams=[];
    if(memberIds.length){
      memberTeams = await api('/rest/v1/teams?id=in.('+memberIds.join(',')+')'+'&select=id,name,description,created_at&order=created_at.desc');
    }
    // Invitaciones pendientes para mi email
    const myEmail = localStorage.getItem('slt_email')||'';
    let pendingInvites=[];
    try{ pendingInvites = await api('/rest/v1/team_invites?email=eq.'+encodeURIComponent(myEmail)+'&status=eq.pending&select=id,team_id,created_at'); }catch{}

    // Contar miembros por grupo
    const allTeams=[...(owned||[]).map(t=>({...t,_role:'owner'})),...(memberTeams||[]).map(t=>({...t,_role:'member'}))];
    const memberCounts={};
    if(allTeams.length){
      const ids=allTeams.map(t=>t.id).join(',');
      try{
        const mrows=await api('/rest/v1/team_members?team_id=in.('+ids+')&select=team_id');
        (mrows||[]).forEach(r=>{ memberCounts[r.team_id]=(memberCounts[r.team_id]||0)+1; });
      }catch{}
    }

    $('skeleton').style.display='none';
    const wrap=$('main-content');
    wrap.style.display='';
    let html='';

    if(pendingInvites.length){
      html+=`<div class="invite-banner" onclick="window.location.href='notifications.html'">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <div class="invite-banner-text">
          <div class="invite-banner-title">Tienes ${pendingInvites.length} invitación${pendingInvites.length>1?'es':''} pendiente${pendingInvites.length>1?'s':''}</div>
          <div class="invite-banner-sub">Toca para ver y responder</div>
        </div>
        <span class="invite-banner-arrow">›</span>
      </div>`;
    }

    if(!allTeams.length){
      wrap.innerHTML=html+`<div class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.85"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="empty-title">Sin grupos todavía</div>
        <div class="empty-sub">Crea un grupo para compartir palistas con otros entrenadores</div>
        <button class="empty-btn" onclick="openSheet()">+ Crear grupo</button>
      </div>`;
      return;
    }

    const ownedList=allTeams.filter(t=>t._role==='owner');
    const memberList=allTeams.filter(t=>t._role==='member');

    function renderGroup(teams, label){
      if(!teams.length)return'';
      const items=teams.map(t=>{
        const cnt=memberCounts[t.id]||0;
        const role=t._role;
        return`<button class="group-card" onclick="window.location.href='team.html?id=${t.id}'">
          <div class="group-icon ${role}"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.85"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="group-info">
            <div class="group-name">${t.name}</div>
            <div class="group-meta">
              <span class="group-role ${role}">${role==='owner'?'Propietario':'Miembro'}</span>
              <span>${cnt} entrenador${cnt!==1?'es':''}</span>
              ${t.description?'<span>· '+t.description.slice(0,40)+(t.description.length>40?'…':'')+'</span>':''}
            </div>
          </div>
          <span class="group-arrow">›</span>
        </button>`;
      }).join('');
      return`<div class="section-label">${label}</div>${items}`;
    }

    html+=renderGroup(ownedList,'Mis grupos');
    html+=renderGroup(memberList,'Grupos a los que pertenezco');
    wrap.innerHTML=html;
  }catch(e){
    $('skeleton').style.display='none';
    $('main-content').style.display='';
    $('main-content').innerHTML=`<div class="empty"><div class="empty-title">Error al cargar</div><div class="empty-sub">${e.message}</div></div>`;
    toast(e.message,'err');
  }
}

window.addEventListener('DOMContentLoaded',()=>{
  _tok=localStorage.getItem('slt_tok');
  _uid=localStorage.getItem('slt_uid');
  if(!_tok){window.location.href='index.html';return;}
  loadTeams();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
