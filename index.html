<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLTimer — Iniciar sesión</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d5c3a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(160deg, #0a2e1a 0%, #0d5c3a 60%, #1a8a5a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; color: white; }
    .logo-area { text-align: center; margin-bottom: 40px; }
    .logo-icon { font-size: 64px; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
    .logo-title { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .logo-subtitle { font-size: 14px; opacity: 0.75; margin-top: 6px; letter-spacing: 0.5px; }
    .card { background: white; border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
    .card h2 { font-size: 22px; font-weight: 700; color: #1a2e1a; margin-bottom: 6px; }
    .card p { font-size: 14px; color: #666; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #d0ddd0; border-radius: 12px; font-size: 16px; color: #1a2e1a; background: #f8faf8; transition: border-color 0.2s, box-shadow 0.2s; }
    .field input:focus { outline: none; border-color: #0d5c3a; box-shadow: 0 0 0 3px rgba(13,92,58,0.12); background: white; }
    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a3a2a 0%, #0d5c3a 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 15px rgba(13,92,58,0.35); }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .toggle-link { text-align: center; margin-top: 16px; font-size: 14px; color: #666; }
    .toggle-link a { color: #0d5c3a; font-weight: 600; cursor: pointer; text-decoration: none; }
    .error-msg { background: #fee2e2; color: #dc2626; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }
    .success-msg { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }
    #register-fields { display: none; }
  </style>
</head>
<body>
  <div class="logo-area">
    <div class="logo-icon">⏱️</div>
    <div class="logo-title">SLTimer</div>
    <div class="logo-subtitle">Cronometrador de Slalom</div>
  </div>
  <div class="card">
    <h2 id="form-title">Bienvenido</h2>
    <p id="form-subtitle">Inicia sesión para continuar</p>
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="register-fields">
      <div class="field">
        <label for="name">Nombre</label>
        <input type="text" id="name" placeholder="Tu nombre">
      </div>
    </div>
    <button class="btn-primary" id="submit-btn" onclick="handleSubmit()">Iniciar sesión</button>
    <div class="toggle-link">
      <span id="toggle-text">¿No tienes cuenta?</span>
      <a onclick="toggleMode()" id="toggle-action">Regístrate</a>
    </div>
  </div>
  <script>
    const SUPA_URL='https://bazprdygkbhvdlzsmhxh.supabase.co';
    const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhenByZHlna2JodmRsenNtaHhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY4MDMwNzgsImV4cCI6MjA2MjM3OTA3OH0.8ARKHgGvWFfFSAhf_bG3qRYh1YDy9kkUXGNXvxXt3_Q';
    let isRegister=false;
    function toggleMode(){isRegister=!isRegister;document.getElementById('form-title').textContent=isRegister?'Crear cuenta':'Bienvenido';document.getElementById('form-subtitle').textContent=isRegister?'Crea tu cuenta gratuita':'Inicia sesión para continuar';document.getElementById('register-fields').style.display=isRegister?'block':'none';document.getElementById('submit-btn').textContent=isRegister?'Crear cuenta':'Iniciar sesión';document.getElementById('toggle-text').textContent=isRegister?'¿Ya tienes cuenta?':'¿No tienes cuenta?';document.getElementById('toggle-action').textContent=isRegister?'Inicia sesión':'Regístrate';}
    function showError(msg){const el=document.getElementById('error-msg');el.textContent=msg;el.style.display='block';document.getElementById('success-msg').style.display='none';}
    function showSuccess(msg){const el=document.getElementById('success-msg');el.textContent=msg;el.style.display='block';document.getElementById('error-msg').style.display='none';}
    async function handleSubmit(){
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      const btn=document.getElementById('submit-btn');
      if(!email||!password){showError('Por favor rellena todos los campos.');return;}
      btn.disabled=true;btn.textContent='Cargando...';
      try{
        let endpoint,body;
        if(isRegister){endpoint=`${SUPA_URL}/auth/v1/signup`;const name=document.getElementById('name').value.trim();body={email,password,data:{name}};}
        else{endpoint=`${SUPA_URL}/auth/v1/token?grant_type=password`;body={email,password};}
        const res=await fetch(endpoint,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data=await res.json();
        if(!res.ok)throw new Error(data.error_description||data.msg||'Error desconocido');
        if(isRegister){showSuccess('Cuenta creada. Revisa tu email para confirmar.');btn.disabled=false;btn.textContent='Crear cuenta';return;}
        localStorage.setItem('sb_access_token',data.access_token);
        localStorage.setItem('sb_refresh_token',data.refresh_token);
        localStorage.setItem('sb_user',JSON.stringify(data.user||{}));
        window.location.href='menu.html';
      }catch(e){showError(e.message);btn.disabled=false;btn.textContent=isRegister?'Crear cuenta':'Iniciar sesión';}
    }
    document.addEventListener('keydown',e=>{if(e.key==='Enter')handleSubmit();});
    // Auto-redirect if already logged in
    if(localStorage.getItem('sb_access_token'))window.location.href='menu.html';
    // PWA service worker
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
